<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>탐구 문제풀이</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f5; --text:#1d2330; --muted:#667085; --line:#e2e5ea;
  --primary:#2f5bd3; --primary-weak:#e7edfb; --ok:#1f8a4c; --ok-weak:#e3f4ea; --bad:#c9302c; --bad-weak:#fbe7e6;
  --warn:#b7791f; --warn-weak:#fdf3e1; --shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161c; --surface:#1c2028; --surface2:#252a34; --text:#e7eaf0; --muted:#9aa3b2; --line:#323846;
    --primary:#7a9cff; --primary-weak:#25304d; --ok:#4cc27e; --ok-weak:#1d3328; --bad:#f2726c; --bad-weak:#3a2222;
    --warn:#e3b04f; --warn-weak:#3a3020; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#13161c; --surface:#1c2028; --surface2:#252a34; --text:#e7eaf0; --muted:#9aa3b2; --line:#323846;
  --primary:#7a9cff; --primary-weak:#25304d; --ok:#4cc27e; --ok-weak:#1d3328; --bad:#f2726c; --bad-weak:#3a2222;
  --warn:#e3b04f; --warn-weak:#3a3020; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;margin-right:auto;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--primary-weak);color:var(--primary);font-weight:600}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-bad{background:var(--bad-weak);color:var(--bad)} .b-ok{background:var(--ok-weak);color:var(--ok)}
.b-warn{background:var(--warn-weak);color:var(--warn)} .b-mute{background:var(--surface2);color:var(--muted)}
.b-pri{background:var(--primary-weak);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;user-select:none;background:var(--surface)}
.chip input{margin:0}
.chip.on{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.field{margin-bottom:16px}
.field>label.t{display:block;font-weight:600;margin-bottom:6px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:140px;resize:vertical}
input[type=text].ans{width:100%;font-size:17px;padding:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over{border-color:var(--primary);background:var(--primary-weak)}
.weak-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.weak-item:last-child{border-bottom:0}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;max-width:220px}
.bar i{display:block;height:100%;background:var(--bad)}
/* quiz */
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:99px;margin:10px 0 16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s}
.qtext{font-size:17px;line-height:1.75;margin-bottom:14px;word-break:keep-all;overflow-wrap:anywhere}
.qnum{font-weight:700;margin-right:4px}
.bogi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--surface2);position:relative;font-size:15.5px}
.bogi-t{display:block;text-align:center;font-weight:600;margin-bottom:6px}
.qimg{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:8px 0;display:block}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--primary)}
.choice.sel{border-color:var(--primary);background:var(--primary-weak)}
.choice.correct{border-color:var(--ok);background:var(--ok-weak)}
.choice.wrong{border-color:var(--bad);background:var(--bad-weak)}
.choice .no{font-weight:700;min-width:20px}
.choice.locked{cursor:default}
.fb{border-radius:10px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-weak);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-weak);border:1px solid var(--bad)}
.fb.neu{background:var(--surface2);border:1px solid var(--line)}
.fb .title{font-weight:700;font-size:17px;margin-bottom:4px}
.expl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.selfgrade{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
.timer.low{color:var(--bad)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chartbox{position:relative;height:260px}
@media (max-width:720px){.charts{grid-template-columns:1fr}}
.list-q{border-bottom:1px solid var(--line);padding:12px 0}
.list-q:last-child{border-bottom:0}
.msg{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13.5px}
.msg.err{background:var(--bad-weak);color:var(--bad)} .msg.wrn{background:var(--warn-weak);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 10px}
.empty p{color:var(--muted)}
details summary{cursor:pointer;color:var(--primary)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo" onclick="go('home')">📘 탐구 문제풀이</div>
  <nav id="nav">
    <button data-v="home">홈</button>
    <button data-v="setup">문제풀기</button>
    <button data-v="analysis">분석</button>
    <button data-v="wrong">오답노트</button>
    <button data-v="upload">문제관리</button>
  </nav>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   1. 저장소 (localStorage + IndexedDB 이미지)
   ========================================================= */
const LS_KEY = 'tamgu_quiz_v1';
let DB = loadDB();
function loadDB(){
  try{ const s = localStorage.getItem(LS_KEY); if(s){ const d = JSON.parse(s); return Object.assign({questions:[],attempts:[],wrong:{},settings:null,sharedHash:null}, d); } }catch(e){}
  return {questions:[], attempts:[], wrong:{}, settings:null};
}
function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
  catch(e){ toast('⚠ 저장 실패: 브라우저 저장공간이 부족하거나 차단되었습니다. 백업을 내보내 주세요.'); }
}
const IMG = {
  db:null,
  open(){ return new Promise((res,rej)=>{ if(this.db) return res(this.db);
    try{ const r = indexedDB.open('tamgu_quiz_img',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('img');
      r.onsuccess = ()=>{ this.db = r.result; res(this.db); };
      r.onerror = ()=> rej(r.error);
    }catch(e){ rej(e); } }); },
  async put(k,v){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction('img','readwrite'); t.objectStore('img').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); },
  async get(k){ try{ const db = await this.open(); return await new Promise(res=>{ const r = db.transaction('img').objectStore('img').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }catch(e){ return null; } },
  async keys(){ try{ const db = await this.open(); return await new Promise(res=>{ const r = db.transaction('img').objectStore('img').getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); }catch(e){ return []; } },
  async clear(){ try{ const db = await this.open(); return await new Promise(res=>{ const t = db.transaction('img','readwrite'); t.objectStore('img').clear(); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
};

/* =========================================================
   2. 공통 유틸
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧'];
const TYPES = ['객관식','단답형','서술형'];
const DIFFS = ['상','중','하'];
const pct = v => v==null || isNaN(v) ? '-' : Math.round(v*100)+'%';
const fmtSec = s => { s = Math.round(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function toast(m, ms=2600){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), ms); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 텍스트 → HTML (줄바꿈, 〈보기〉 박스) + 수식 렌더링 */
function rich(s){ return esc(s).replace(/\r?\n/g,'<br>'); }
function qTextHTML(text){
  // 한 줄에 '〈보기〉'만 단독으로 있을 때 그 아래를 보기 박스로 표시 (문장 속 '〈보기〉에서'는 그대로 둠)
  const s = String(text||''), m = s.match(/\r?\n[ \t]*[〈<]\s*보\s*기\s*[〉>][ \t]*(\r?\n|$)/);
  if(!m) return rich(s);
  return rich(s.slice(0, m.index)) + `<div class="bogi"><span class="bogi-t">〈보 기〉</span>${rich(s.slice(m.index + m[0].length))}</div>`;
}
function renderMath(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}], throwOnError:false}); }catch(e){}
  }
}
async function hydrateImages(el){
  for(const img of el.querySelectorAll('img[data-img]')){
    const k = img.dataset.img;
    if(/^(https?:|data:)/i.test(k)){ img.src = k; continue; }
    const blob = await IMG.get(k);
    if(blob){ img.src = URL.createObjectURL(blob); continue; }
    img.onerror = ()=> img.replaceWith(Object.assign(document.createElement('div'),{className:'msg wrn',textContent:`이미지 '${k}'를 찾을 수 없습니다. (images 폴더 또는 문제관리 이미지 업로드 확인)`}));
    img.src = 'images/' + encodeURIComponent(k);
  }
}
function imgHTML(q){ return q.image ? `<img class="qimg" data-img="${esc(q.image)}" alt="문제 이미지">` : ''; }

/* =========================================================
   3. 통계 엔진
   ========================================================= */
function aggregate(atts, keyFn){
  const m = new Map();
  for(const a of atts){ const k = keyFn(a); if(k==null) continue;
    let o = m.get(k); if(!o){ o = {key:k,n:0,sum:0,time:0,sample:a}; m.set(k,o); }
    o.n++; o.sum += a.score; o.time += a.time||0; }
  for(const o of m.values()){ o.acc = o.sum/o.n; o.avgTime = o.time/o.n; }
  return [...m.values()];
}
const MIN_N = 5, WEAK = 0.6, GOOD = 0.8;
function judge(o){
  if(o.n < MIN_N) return '<span class="badge b-mute">표본부족</span>';
  if(o.acc < WEAK) return '<span class="badge b-bad">🔴 취약</span>';
  if(o.acc < GOOD) return '<span class="badge b-warn">🟡 보통</span>';
  return '<span class="badge b-ok">🟢 양호</span>';
}
function unitAccMap(){ const r = {}; for(const o of aggregate(DB.attempts, a=>a.subject+'|'+a.unit)) r[o.key] = o.acc; return r; }
function weakUnits(atts, limit=3){
  return aggregate(atts, a=>a.subject+'|'+a.unit).filter(o=>o.n>=MIN_N && o.acc<WEAK).sort((a,b)=>a.acc-b.acc||b.n-a.n).slice(0,limit);
}
function streakDays(){
  const days = new Set(DB.attempts.map(a=>dayKey(a.ts)));
  let d = new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0; while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const openWrong = () => Object.entries(DB.wrong).filter(([id,w])=>!w.cleared && DB.questions.some(q=>q.id===id));

/* =========================================================
   4. 라우팅
   ========================================================= */
let current = 'home', session = null, timerId = null, charts = [];
const VIEWS = {home:viewHome, upload:viewUpload, setup:viewSetup, quiz:viewQuiz, result:viewResult, analysis:viewAnalysis, wrong:viewWrong};
function go(v){
  if(current==='quiz' && v!=='quiz' && v!=='result' && session && !session.done){
    if(!confirm('풀이 중인 세션을 종료할까요? 지금까지 제출한 답은 저장됩니다.')) return;
    finishSession(false);
  }
  current = v; charts.forEach(c=>c.destroy()); charts = [];
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v || (v==='quiz'&&b.dataset.v==='setup') || (v==='result'&&b.dataset.v==='setup')));
  VIEWS[v](); window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

/* =========================================================
   5. 홈
   ========================================================= */
function viewHome(){
  const atts = DB.attempts, nQ = DB.questions.length;
  if(!nQ && SHARED_INFO.loading){ $('#app').innerHTML = `<div class="card empty"><h2>공용 문제은행을 불러오는 중…</h2></div>`; return; }
  if(!nQ){
    $('#app').innerHTML = `<div class="card empty">
      <h2>문제은행이 비어 있습니다</h2>
      <p>양식에 맞춘 엑셀(xlsx)·CSV 파일을 업로드하거나, 샘플 문제로 바로 체험해 보세요.</p>
      <div class="row" style="justify-content:center;margin-top:16px">
        <button class="btn pri" onclick="loadSample(true)">샘플 문제 불러오기</button>
        <button class="btn" onclick="go('upload')">문제 업로드</button>
        <button class="btn" onclick="downloadTemplate()">📥 업로드 양식 받기</button>
      </div></div>`;
    return;
  }
  const acc = atts.length ? atts.reduce((s,a)=>s+a.score,0)/atts.length : null;
  const weak = weakUnits(atts);
  const wn = openWrong().length;
  $('#app').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="l">문제은행</div><div class="v">${nQ}</div></div>
      <div class="kpi"><div class="l">누적 풀이</div><div class="v">${atts.length}</div></div>
      <div class="kpi"><div class="l">전체 정답률</div><div class="v">${pct(acc)}</div></div>
      <div class="kpi"><div class="l">연속 학습</div><div class="v">${streakDays()}일</div></div>
      <div class="kpi"><div class="l">미해결 오답</div><div class="v">${wn}</div></div>
    </div>
    <div class="card">
      <h3>⚠ 취약 영역 Top 3</h3>
      ${weak.length ? weak.map((o,i)=>`<div class="weak-item"><b>${i+1}.</b><span>${esc(o.sample.subject)} &gt; ${esc(o.sample.unit)}</span><span class="sp"></span>
          <div class="bar"><i style="width:${Math.round(o.acc*100)}%"></i></div><b style="min-width:44px;text-align:right">${pct(o.acc)}</b><span class="muted small">(${o.n}문항)</span></div>`).join('')
        : `<p class="muted">${atts.length ? `정답률 ${WEAK*100}% 미만인 단원이 없습니다. (단원별 ${MIN_N}문항 이상 풀어야 판정됩니다)` : '아직 풀이 기록이 없습니다. 문제를 풀면 취약 영역을 자동으로 분석합니다.'}</p>`}
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn pri" onclick="go('setup')">▶ 새로 풀기</button>
      <button class="btn" onclick="startWrongSession()" ${wn?'':'disabled'}>↻ 오답만 다시 풀기 (${wn})</button>
      <button class="btn" onclick="go('analysis')">📊 분석 리포트</button>
    </div>`;
}

/* =========================================================
   6. 업로드 / 문제관리
   ========================================================= */
const COLMAP = {'문항id':'id','id':'id','과목':'subject','대단원':'unit','단원':'unit','소단원':'subunit','유형':'type','난이도':'difficulty','문제':'text','이미지':'image',
  '보기1':'c1','보기2':'c2','보기3':'c3','보기4':'c4','보기5':'c5','선택지1':'c1','선택지2':'c2','선택지3':'c3','선택지4':'c4','선택지5':'c5','정답':'answer','해설':'explanation','배점':'points','채점기준':'criteria'};
function normType(t){ t = String(t||'').replace(/\s/g,'');
  if(/객관|선다|5지|오지/.test(t)) return '객관식';
  if(/단답|주관/.test(t)) return '단답형';
  if(/서술|논술/.test(t)) return '서술형';
  return null; }
let pending = null;

function viewUpload(){
  const bySub = {};

async function refreshImgCount(){ const k = await IMG.keys(); const el = $('#imgcount'); if(el) el.textContent = `저장된 이미지 ${k.length}개`; }

async function readQuestionFile(f){
  if(!window.XLSX){ toast('엑셀 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  try{
    let wb;
    if(/\.csv$/i.test(f.name)){
      const buf = await f.arrayBuffer();
      let txt = new TextDecoder('utf-8').decode(buf);
      if(txt.includes('�')) txt = new TextDecoder('euc-kr').decode(buf);   // 엑셀 CSV(CP949) 대응
      wb = XLSX.read(txt.replace(/^﻿/,''), {type:'string', raw:true});
    } else {
      wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    }
    const sh = wb.Sheets['문제'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sh, {defval:'', raw:false});
    pending = await validateRows(rows, f.name);
    renderPending();
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다: '+e.message); }
}

async function validateRows(rows, fname){
  const valid = [], errors = [], warnings = [], seen = new Set();
  const existing = new Set(DB.questions.map(q=>q.id));
  const imgKeys = new Set(await IMG.keys());
  let overwrite = 0;
  rows.forEach((r, i)=>{
    const line = i+2, o = {};
    for(const [k,v] of Object.entries(r)){ const key = COLMAP[String(k).replace(/\s/g,'').toLowerCase()]; if(key) o[key] = String(v??'').trim(); }
    if(!Object.values(o).some(v=>v)) return;                                  // 빈 행
    const err = m => errors.push(`${line}행: ${m}`), wrn = m => warnings.push(`${line}행: ${m}`);
    const type = normType(o.type);
    if(!o.subject) return err('과목이 비어 있습니다');
    if(!o.unit) return err('대단원이 비어 있습니다');
    if(!o.text) return err('문제가 비어 있습니다');
    if(!type) return err(`유형 '${o.type}'을(를) 알 수 없습니다 (객관식/단답형/서술형)`);
    if(!o.answer) return err(type==='서술형' ? '정답(모범답안)이 비어 있습니다' : '정답이 비어 있습니다');
    const q = {id:o.id, subject:o.subject, unit:o.unit, subunit:o.subunit||'', type, difficulty:o.difficulty, text:o.text, image:o.image||'',
               choices:[], answer:o.answer, explanation:o.explanation||'', points:Number(o.points)||(type==='객관식'?2:3), criteria:o.criteria||''};
    if(!DIFFS.includes(q.difficulty)){ if(o.difficulty) wrn(`난이도 '${o.difficulty}' → '중'으로 처리`); q.difficulty='중'; }
    if(type==='객관식'){
      const cs = [o.c1,o.c2,o.c3,o.c4,o.c5]; let last = cs.length; while(last>0 && !cs[last-1]) last--;
      q.choices = cs.slice(0,last);
      if(q.choices.length < 2) return err('객관식은 보기가 2개 이상 필요합니다');
      if(q.choices.some(c=>!c)) return err('보기 중간에 빈 칸이 있습니다');
      const a = String(q.answer).replace(/[①②③④⑤]/g, c=>CIRCLED.indexOf(c)+1).replace(/[^0-9]/g,'');
      if(!a || +a<1 || +a>q.choices.length) return err(`정답 '${o.answer}'이(가) 보기 번호(1~${q.choices.length}) 범위를 벗어났습니다`);
      q.answer = String(+a);
      if(q.choices.length !== 5) wrn(`보기가 ${q.choices.length}개입니다`);
    }
    if(type==='서술형' && !q.criteria) wrn('서술형 채점기준(키워드)이 없어 자동 예비채점이 생략됩니다');
    if(!q.id){ q.id = `${q.subject}-R${line}`; wrn(`문항ID가 없어 '${q.id}'로 자동 생성`); }
    if(seen.has(q.id)) wrn(`문항ID '${q.id}' 중복 → 아래쪽 행으로 덮어씀`);
    if(existing.has(q.id)) overwrite++;
    if(q.image && !/^(https?:|data:)/i.test(q.image) && !imgKeys.has(q.image)) wrn(`이미지 '${q.image}' 파일이 아직 업로드되지 않았습니다`);
    seen.add(q.id);
    const idx = valid.findIndex(v=>v.id===q.id); if(idx>=0) valid[idx]=q; else valid.push(q);
  });
  return {fname, valid, errors, warnings, overwrite};
}

function renderPending(){
  const p = pending, el = $('#pv'); if(!el) return;
  if(!p){ el.innerHTML=''; return; }
  const list = (arr, cls) => arr.slice(0,30).map(m=>`<div class="msg ${cls}">${esc(m)}</div>`).join('') + (arr.length>30?`<div class="small muted">… 외 ${arr.length-30}건</div>`:'');
  el.innerHTML = `<div style="margin-top:16px">
    <div class="row"><b>${esc(p.fname)}</b> 검증 결과:
      <span class="badge b-ok">✅ 정상 ${p.valid.length}</span><span class="badge b-warn">⚠ 경고 ${p.warnings.length}</span><span class="badge b-bad">❌ 오류 ${p.errors.length}</span></div>
    ${p.errors.length?`<div style="margin-top:8px"><div class="small muted">오류 행은 저장되지 않습니다.</div>${list(p.errors,'err')}</div>`:''}
    ${p.warnings.length?`<details style="margin-top:8px"><summary>경고 ${p.warnings.length}건 보기</summary>${list(p.warnings,'wrn')}</details>`:''}
    ${isAdmin()?`<div class="row" style="margin-top:12px"><b>저장 위치</b>
      <label><input type="radio" name="target" value="shared" checked> 🌐 공용 문제은행에 게시 (모든 사용자)</label>
      <label><input type="radio" name="target" value="local"> 내 브라우저에만 저장</label></div>`:''}
    <div class="row" style="margin-top:8px">
      <label><input type="radio" name="mode" value="add" checked> 추가 (같은 ID는 덮어쓰기${p.overwrite?` · ${p.overwrite}건`:''})</label>
      <label><input type="radio" name="mode" value="replace"> 전체 교체</label>
      <span class="sp"></span>
      <button class="btn" onclick="pending=null;renderPending()">취소</button>
      <button class="btn pri" id="commit" ${p.valid.length?'':'disabled'}>${p.valid.length}문항 ${isAdmin()?'게시/저장':'저장'}</button>
    </div></div>`;
  $('#commit').onclick = async ()=>{
    const mode = document.querySelector('input[name=mode]:checked').value;
    const target = document.querySelector('input[name=target]:checked')?.value || 'local';
    if(target==='shared'){
      if(mode==='replace' && !confirm('공용 문제은행 전체를 이 파일로 교체합니다. 모든 사용자에게 반영됩니다. 계속할까요?')) return;
      const btn = $('#commit'); btn.disabled = true; btn.textContent = '게시 중…';
      try{
        const n = await publishShared(cur=>{
          if(mode==='replace') return p.valid.slice();
          const m = new Map(cur.map(q=>[q.id,q])); p.valid.forEach(q=>m.set(q.id,q)); return [...m.values()];
        }, `문제 업로드: ${p.fname} (${p.valid.length}문항${mode==='replace'?', 전체 교체':''})`);
        toast(`공용 문제은행에 게시했습니다 (총 ${n}문항). 다른 사용자에게는 1~2분 후 반영됩니다`, 6000);
        pending = null; viewUpload();
      }catch(e){ toast('게시 실패: '+e.message, 8000); btn.disabled = false; btn.textContent = `${p.valid.length}문항 게시/저장`; }
      return;
    }
    if(mode==='replace'){ if(!confirm('직접 올린 개인 문제를 모두 지우고 교체할까요? (공용 문제는 유지)')) return; DB.questions = DB.questions.filter(q=>q.src==='shared'); }
    const map = new Map(DB.questions.map(q=>[q.id,q])); for(const q of p.valid){ delete q.src; map.set(q.id,q); }
    DB.questions = [...map.values()]; saveDB(); toast(`${p.valid.length}문항을 저장했습니다`); pending = null; viewUpload();
  };
}

const HEADERS = ['문항ID','과목','대단원','소단원','유형','난이도','문제','이미지','보기1','보기2','보기3','보기4','보기5','정답','해설','배점','채점기준'];

function downloadTemplate(){

  const wb = XLSX.utils.book_new();
  const ex = SAMPLE.filter(q=>['PHY-001','PHY-003','ETH-004','CHE-003'].includes(q.id));
  const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...ex.map(qToRow)]);
  ws['!cols'] = HEADERS.map(h=>({wch: h==='문제'?60: h==='해설'?40: h.startsWith('보기')?14:12}));
  XLSX.utils.book_append_sheet(wb, ws, '문제');

    ['유형','○','객관식/단답형/서술형',''],['난이도','','상/중/하','기본 중'],['문제','○','','줄바꿈 가능. 〈보기〉 라는 줄 아래는 보기 박스. 수식은 $...$'],['이미지','','phy_001.png 또는 URL',''],
    ['보기1~5','객관식 필수','',''],['정답','○','3 / 운동량|p','객관식은 번호, 단답형 복수정답은 |, 서술형은 모범답안'],['해설','','',''],['배점','','2/3',''],['채점기준','','작용, 반작용','서술형 키워드(쉼표 구분)']];

let cfg = null;
function defaultCfg(subs){ return {subjects:subs.slice(), unitsOff:[], types:TYPES.slice(), diffs:DIFFS.slice(), count:20, limit:0, excludeCorrect:false, weighted:true, shuffle:false}; }
function viewSetup(){
  const subs = [...new Set(DB.questions.map(q=>q.subject))];
  if(!subs.length){ $('#app').innerHTML = `<div class="card empty"><h2>등록된 문제가 없습니다</h2><div class="row" style="justify-content:center"><button class="btn pri" onclick="loadSample(false);go('setup')">샘플 문제 불러오기</button><button class="btn" onclick="go('upload')">문제 업로드</button></div></div>`; return; }
  cfg = cfg || Object.assign(defaultCfg(subs), DB.settings||{});
  cfg.subjects = cfg.subjects.filter(s=>subs.includes(s)); if(!cfg.subjects.length) cfg.subjects = subs.slice();
  const chip = (group,val,on,label) => `<label class="chip ${on?'on':''}"><input type="checkbox" data-g="${group}" value="${esc(val)}" ${on?'checked':''}>${esc(label??val)}</label>`;
  $('#app').innerHTML = `<h2>출제 설정</h2><div class="card">
    <div class="field"><label class="t">과목</label><div class="chips">${subs.map(s=>chip('subjects',s,cfg.subjects.includes(s))).join('')}</div></div>
    <div class="field"><label class="t">단원 <button class="btn sm" id="uall">전체 선택</button> <button class="btn sm" id="unone">전체 해제</button></label><div id="units"></div></div>
    <div class="field"><label class="t">유형</label><div class="chips">${TYPES.map(t=>chip('types',t,cfg.types.includes(t))).join('')}</div></div>
    <div class="field"><label class="t">난이도</label><div class="chips">${DIFFS.map(t=>chip('diffs',t,cfg.diffs.includes(t))).join('')}</div></div>
    <div class="field row"><label class="t" style="margin:0">문항 수</label><input type="number" id="cnt" min="1" max="200" value="${cfg.count}" style="width:90px">
      <label class="t" style="margin:0 0 0 16px">제한시간</label><select id="lim">${[[0,'없음'],[10,'10분'],[20,'20분'],[30,'30분 (수능 1과목)'],[60,'60분']].map(([v,l])=>`<option value="${v}" ${cfg.limit==v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label class="t">옵션</label><div class="chips">
      ${chip('opt','excludeCorrect',cfg.excludeCorrect,'이미 맞힌 문제 제외')}${chip('opt','weighted',cfg.weighted,'취약 단원 가중 출제')}${chip('opt','shuffle',cfg.shuffle,'선택지 순서 섞기')}</div>
      <div class="hint">취약 단원 가중: 정답률이 낮은 단원의 문제가 더 자주 나옵니다. 선택지 섞기는 '①, ②' 등 번호를 참조하는 보기가 있으면 끄세요.</div></div>
    <div class="row"><span id="poolinfo" class="muted"></span><span class="sp"></span><button class="btn pri" id="start">시작하기 ▶</button></div></div>`;
  const renderUnits = ()=>{
    const units = []; const seen = new Set();
    for(const q of DB.questions) if(cfg.subjects.includes(q.subject)){ const k=q.subject+'|'+q.unit; if(!seen.has(k)){ seen.add(k); units.push(k); } }
    $('#units').innerHTML = `<div class="chips">${units.map(k=>chip('units',k,!cfg.unitsOff.includes(k),(cfg.subjects.length>1?k.split('|')[0]+' · ':'')+k.split('|')[1])).join('')}</div>`;
    bind(); updateInfo();
  };
  const updateInfo = ()=>{ const n = buildPool(cfg).length; $('#poolinfo').textContent = `조건에 맞는 문항: ${n}개`; $('#start').disabled = !n; };
  const bind = ()=> document.querySelectorAll('#app input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const g = cb.dataset.g, v = cb.value; cb.parentElement.classList.toggle('on', cb.checked);
    if(g==='opt') cfg[v] = cb.checked;
    else if(g==='units'){ cfg.unitsOff = cfg.unitsOff.filter(x=>x!==v); if(!cb.checked) cfg.unitsOff.push(v); }
    else { cfg[g] = cfg[g].filter(x=>x!==v); if(cb.checked) cfg[g].push(v); }
    if(g==='subjects') renderUnits(); else updateInfo();
  });
  $('#uall').onclick = ()=>{ cfg.unitsOff=[]; renderUnits(); };
  $('#unone').onclick = ()=>{ cfg.unitsOff = [...new Set(DB.questions.filter(q=>cfg.subjects.includes(q.subject)).map(q=>q.subject+'|'+q.unit))]; renderUnits(); };
  $('#cnt').oninput = e=>{ cfg.count = Math.max(1, +e.target.value||1); };
  $('#lim').onchange = e=>{ cfg.limit = +e.target.value; };
  $('#start').onclick = ()=>{
    const pool = buildPool(cfg); const qs = sample(pool, Math.min(cfg.count, pool.length), cfg.weighted);
    DB.settings = cfg; saveDB();
    if(pool.length < cfg.count) toast(`조건에 맞는 문항이 ${pool.length}개라 ${pool.length}문항으로 출제합니다`);
    startSession(qs, {limit:cfg.limit, shuffle:cfg.shuffle, mode:'normal'});
  };
  renderUnits();
}
function buildPool(c){
  const correct = new Set(DB.attempts.filter(a=>a.score===1).map(a=>a.qid));
  return DB.questions.filter(q=>c.subjects.includes(q.subject) && !c.unitsOff.includes(q.subject+'|'+q.unit) && c.types.includes(q.type) && c.diffs.includes(q.difficulty) && !(c.excludeCorrect && correct.has(q.id)));
}
/* 가중치 비복원 추출: weight = 0.2 + (1 - 단원 정답률), 기록 없는 단원은 정답률 0.5로 간주 */
function sample(pool, n, weighted){
  const acc = weighted ? unitAccMap() : {};
  const items = pool.map(q=>({q, w: weighted ? 0.2 + (1 - (acc[q.subject+'|'+q.unit] ?? 0.5)) : 1}));
  const out = [];
  while(out.length < n && items.length){
    let r = Math.random() * items.reduce((s,x)=>s+x.w,0), i = 0;
    for(; i<items.length-1; i++){ r -= items[i].w; if(r <= 0) break; }
    out.push(items.splice(i,1)[0].q);
  }
  return out;
}

function startSession(qs, opt){
  if(!qs.length) return toast('출제할 문제가 없습니다');
  session = {id:'S'+Date.now().toString(36), items:qs.map(q=>({q, perm: (opt.shuffle && q.type==='객관식') ? shuffle(q.choices.map((_,i)=>i)) : q.choices.map((_,i)=>i), att:null})),
             idx:0, start:Date.now(), limit:(opt.limit||0)*60000, mode:opt.mode, skipped:0, done:false};
  clearInterval(timerId);
  if(session.limit) timerId = setInterval(tick, 1000);
  current = 'quiz'; go('quiz');
}
function startWrongSession(){
  const ids = openWrong().map(([id])=>id);
  const qs = shuffle(DB.questions.filter(q=>ids.includes(q.id)));
  if(!qs.length) return toast('다시 풀 오답이 없습니다');
  startSession(qs, {limit:0, shuffle:false, mode:'wrong'});
}
function tick(){
  if(!session || session.done){ clearInterval(timerId); return; }
  const left = session.limit - (Date.now()-session.start), el = $('#timer');
  if(el){ el.textContent = '⏱ 남은 시간 ' + fmtSec(Math.max(0,left)/1000); el.classList.toggle('low', left < 60000); }
  if(left <= 0){ toast('제한시간이 끝났습니다'); finishSession(true); }
}

    <div id="fb"></div>

      <button class="btn pri" id="submit" disabled>제출</button></div>

function answerAreaHTML(it){
  const q = it.q;
  if(q.type==='객관식') return `<div class="choices">${it.perm.map((orig,k)=>`<div class="choice" data-k="${k}"><span class="no">${CIRCLED[k]}</span><span>${rich(q.choices[orig])}</span></div>`).join('')}</div>`;
  if(q.type==='단답형') return `<input type="text" class="ans" id="uans" placeholder="답을 입력하세요" autocomplete="off">`;
  return `<textarea id="uans" placeholder="답안을 서술하세요"></textarea>`;
}
document.addEventListener('keydown', e=>{
  if(current!=='quiz' || !session || session.done) return;
  const q = session.items[session.idx]?.q; if(!q) return;
  if(phase==='answer' && q.type==='객관식' && /^[1-8]$/.test(e.key) && document.activeElement.tagName!=='INPUT'){
    const c = document.querySelector(`.choice[data-k="${+e.key-1}"]`); if(c) c.click();
  } else if(e.key==='Enter' && !e.isComposing && !(q.type==='서술형' && phase==='answer')){
    if(phase==='answer'){ const b=$('#submit'); if(b && !b.disabled){ e.preventDefault(); b.click(); } }
    else if(phase==='done'){ const b=$('#next'); if(b){ e.preventDefault(); b.click(); } }
  }
});

/* 채점 */
function normAns(s){
  return String(s??'').normalize('NFKC').toLowerCase().replace(/[×✕✖]/g,'x').replace(/\*/g,'x').replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/[.。,]+$/,'');
}
function gradeShort(user, answer){
  const u = normAns(user); if(!u) return false;
  return String(answer).split('|').some(a=>{
    const n = normAns(a); if(!n) return false;
    if(u===n) return true;
    const un = Number(u), an = Number(n);
    return !isNaN(un) && !isNaN(an) && Math.abs(un-an) < 1e-9;
  });
}
function keywordCheck(user, criteria){
  const kws = String(criteria||'').split(/[,|\n;]/).map(s=>s.trim()).filter(Boolean);
  const u = normAns(user);
  return kws.map(k=>({k, hit: u.includes(normAns(k))}));
}
function submit(){
  const it = session.items[session.idx], q = it.q, time = (Date.now()-qStart)/1000;
  if(q.type==='객관식'){
    const userOrig = it.perm[selected]+1, ok = String(userOrig)===String(q.answer);
    const correctK = it.perm.indexOf(+q.answer-1);
    document.querySelectorAll('.choice').forEach(c=>{ const k=+c.dataset.k; c.classList.add('locked'); c.classList.remove('sel');
      if(k===correctK) c.classList.add('correct'); else if(k===selected) c.classList.add('wrong'); });
    record(it, ok?1:0, String(userOrig), time);
    showFeedback(ok, `내 답: ${CIRCLED[selected]} · 정답: ${CIRCLED[correctK]}`, it);
  } else if(q.type==='단답형'){
    const user = $('#uans').value.trim(), ok = gradeShort(user, q.answer);
    $('#uans').disabled = true;
    record(it, ok?1:0, user, time);
    showFeedback(ok, `내 답: ${esc(user)} · 정답: ${q.answer.split('|').map(esc).join(' / ')}`, it, !ok);
  } else {
    const user = $('#uans').value.trim(); $('#uans').disabled = true;
    const kc = keywordCheck(user, q.criteria), hit = kc.filter(x=>x.hit).length, ratio = kc.length ? hit/kc.length : null;
    const suggest = ratio==null ? null : ratio>=0.7 ? 1 : ratio>=0.4 ? 0.5 : 0;
    phase = 'grading';
    $('#actions').innerHTML = '';
    $('#fb').innerHTML = `<div class="fb neu">
      <div class="title">📝 모범답안과 비교해 스스로 채점하세요</div>
      <div><b>모범답안</b><br>${rich(q.answer)}</div>
      ${kc.length?`<div class="expl"><b>핵심 키워드 자동 점검</b> — ${hit}/${kc.length}개 포함 (예비점수 ${Math.round(ratio*100)}%)<br>
        ${kc.map(x=>`<span class="badge ${x.hit?'b-ok':'b-bad'}" style="margin:3px 3px 0 0">${x.hit?'✔':'✖'} ${esc(x.k)}</span>`).join('')}</div>`:''}
      ${q.explanation?`<div class="expl"><b>해설</b><br>${rich(q.explanation)}</div>`:''}
      <div class="selfgrade">
        ${[[1,'○ 맞음 (100%)','ok'],[0.5,'△ 부분 (50%)','warn'],[0,'× 틀림 (0%)','bad']].map(([v,l])=>`<button class="btn ${suggest===v?'pri':''}" data-sg="${v}">${l}${suggest===v?' · 추천':''}</button>`).join('')}
      </div></div>`;
    renderMath($('#fb'));
    document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{
      const sc = +b.dataset.sg; record(it, sc, user, time);
      document.querySelectorAll('[data-sg]').forEach(x=>{ x.disabled=true; x.classList.toggle('pri', x===b); });
      phase = 'done'; addNextButton(it);
    });
  }
}
function record(it, score, answer, time){
  const q = it.q;
  const a = {qid:q.id, subject:q.subject, unit:q.unit, subunit:q.subunit, type:q.type, difficulty:q.difficulty, points:q.points, score, answer, time:Math.round(time), ts:Date.now(), sid:session.id};
  DB.attempts.push(a); it.att = a;
  const w = DB.wrong[q.id];
  if(score < 1){ DB.wrong[q.id] = {count:(w?.count||0)+1, lastTs:a.ts, cleared:false, starred:w?.starred||false}; a._createdWrong = true; }
  else if(w){ w.cleared = true; }
  saveDB();
}
function showFeedback(ok, line, it, allowAppeal){
  const q = it.q; phase = 'done';
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}">
    <div class="title">${ok?'⭕ 정답입니다!':'❌ 오답입니다.'}</div><div>${line}</div>
    ${q.explanation?`<div class="expl"><b>📖 해설</b><br>${rich(q.explanation)}</div>`:''}
    <div class="row" style="margin-top:10px">
      ${allowAppeal?'<button class="btn sm" id="appeal">내 답도 맞아요 (정답 인정)</button>':''}
      <button class="btn sm" id="star">${DB.wrong[q.id]?.starred?'★ 오답노트 저장됨':'☆ 오답노트에 저장'}</button></div></div>`;
  renderMath($('#fb'));
  $('#star').onclick = ()=>{ const w = DB.wrong[q.id] ||= {count:0,lastTs:Date.now(),cleared:false,starred:false}; w.starred = true; w.cleared = false; saveDB(); $('#star').textContent='★ 오답노트 저장됨'; };
  if(allowAppeal) $('#appeal').onclick = ()=>{
    const a = it.att; a.score = 1; a.appealed = true; const w = DB.wrong[q.id];
    if(w){ w.count = Math.max(0, w.count-1); if(w.count===0 && !w.starred) delete DB.wrong[q.id]; else w.cleared = true; }
    saveDB(); const f = $('#fb .fb'); f.className='fb ok'; f.querySelector('.title').textContent='⭕ 정답으로 인정했습니다'; $('#appeal').remove();
  };
  $('#actions').innerHTML = ''; addNextButton(it);
}
function addNextButton(){
  const last = session.idx >= session.items.length-1;
  $('#actions').innerHTML = `<span class="sp"></span><button class="btn pri" id="next">${last?'결과 보기':'다음 문제 ▶'}</button>`;
  $('#next').onclick = nextQ; $('#next').focus();
}
function nextQ(){ if(session.idx >= session.items.length-1) return finishSession(true); session.idx++; viewQuiz(); window.scrollTo(0,0); }
function finishSession(show){
  if(!session) return; session.done = true; session.end = Date.now(); clearInterval(timerId);
  if(show){ current = 'result'; go('result'); }
}

}

    <select id="fs"><option value="">전체 과목</option>${subs.map(s=>`<option ${anaF.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
  if(!atts.length){ $('#app').innerHTML = head + `<div class="card empty"><p>선택한 기간에 풀이 기록이 없습니다.</p><button class="btn pri" onclick="go('setup')">문제 풀러 가기</button></div>`; bindAnaFilters(); return; }
  const n = atts.length, acc = atts.reduce((s,a)=>s+a.score,0)/n, avgT = atts.reduce((s,a)=>s+a.time,0)/n;
  const bySub = aggregate(atts, a=>a.subject).sort((a,b)=>a.acc-b.acc);
  const byUnit = aggregate(atts, a=> anaF.group==='sub' ? a.subject+'|'+a.unit+'|'+(a.subunit||'(미지정)') : a.subject+'|'+a.unit).sort((a,b)=>(a.n>=MIN_N?0:1)-(b.n>=MIN_N?0:1) || a.acc-b.acc);
  const byType = aggregate(atts, a=>a.type), byDiff = aggregate(atts, a=>a.difficulty);
  const byDay = aggregate(atts, a=>dayKey(a.ts)).sort((a,b)=>a.key<b.key?-1:1);
  const weak = weakUnits(atts, 3);
  $('#app').innerHTML = head + `
    <div class="kpis">
      <div class="kpi"><div class="l">풀이 문항</div><div class="v">${n}</div></div>
      <div class="kpi"><div class="l">정답률</div><div class="v">${pct(acc)}</div></div>
      <div class="kpi"><div class="l">평균 풀이시간</div><div class="v">${fmtSec(avgT)}</div></div>
      <div class="kpi"><div class="l">취약 단원 수</div><div class="v">${aggregate(atts,a=>a.subject+'|'+a.unit).filter(o=>o.n>=MIN_N&&o.acc<WEAK).length}</div></div>
    </div>
    <div class="card"><h3>💡 진단 및 학습 제안</h3><ul style="margin:0;padding-left:20px">${diagnose(atts, weak, avgT).map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="charts">
      <div class="card"><h3>${anaF.subject?'단원별':'과목별'} 정답률</h3><div class="chartbox"><canvas id="c1"></canvas></div></div>
      <div class="card"><h3>일자별 정답률 추이</h3><div class="chartbox"><canvas id="c2"></canvas></div></div>
    </div>
    <div class="card"><div class="row"><h3 style="margin:0">단원별 상세</h3><span class="sp"></span>
      <label class="small"><input type="checkbox" id="grp" ${anaF.group==='sub'?'checked':''}> 소단원까지 보기</label></div>
      <div class="tbl" style="margin-top:8px"><table><tr><th>과목</th><th>단원</th>${anaF.group==='sub'?'<th>소단원</th>':''}<th class="num">풀이</th><th class="num">정답률</th><th class="num">평균시간</th><th>판정</th></tr>
      ${byUnit.map(o=>{ const p=o.key.split('|'); return `<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td>${anaF.group==='sub'?`<td>${esc(p[2])}</td>`:''}<td class="num">${o.n}</td><td class="num">${pct(o.acc)}</td><td class="num">${fmtSec(o.avgTime)}</td><td>${judge(o)}</td></tr>`; }).join('')}</table></div>
      <div class="hint">판정 기준: 정답률 ${WEAK*100}% 미만 취약 · ${GOOD*100}% 미만 보통 · 이상 양호 (${MIN_N}문항 미만은 표본부족)</div></div>

      <div class="card"><h3>유형별</h3>${miniTable(byType, TYPES)}</div>

    ${!anaF.subject && bySub.length?`<div class="card"><h3>과목별 요약</h3>${miniTable(bySub)}</div>`:''}`;

function bindAnaFilters(){
  $('#fd').onchange = e=>{ anaF.days = +e.target.value; viewAnalysis(); };
  $('#fs').onchange = e=>{ anaF.subject = e.target.value; viewAnalysis(); };

function miniTable(rows, order){
  if(order) rows = order.map(k=>rows.find(r=>r.key===k)).filter(Boolean);
  return `<div class="tbl"><table><tr><th>구분</th><th class="num">풀이</th><th class="num">정답률</th><th class="num">평균시간</th><th>판정</th></tr>
    ${rows.map(o=>`<tr><td>${esc(o.key)}</td><td class="num">${o.n}</td><td class="num">${pct(o.acc)}</td><td class="num">${fmtSec(o.avgTime)}</td><td>${judge(o)}</td></tr>`).join('')}</table></div>`;
}
function diagnose(atts, weak, avgT){
  const out = [];
  if(!weak.length){
    const low = aggregate(atts, a=>a.subject+'|'+a.unit).filter(o=>o.n<MIN_N);
    out.push(`정답률 ${WEAK*100}% 미만인 취약 단원이 없습니다.` + (low.length?` 다만 ${low.length}개 단원은 풀이가 ${MIN_N}문항 미만이라 판정이 보류되었습니다. 더 풀어 보세요.`:''));
  }
  for(const w of weak){
    const ua = atts.filter(a=>a.subject+'|'+a.unit===w.key);
    const d = aggregate(ua, a=>a.difficulty).sort((a,b)=>a.acc-b.acc)[0];
    const s = aggregate(ua, a=>a.subunit||null).filter(o=>o.n>=2).sort((a,b)=>a.acc-b.acc)[0];
    let t = `<b>${esc(w.sample.subject)} › ${esc(w.sample.unit)}</b> 정답률 ${pct(w.acc)} (${w.n}문항).`;
    if(d && d.acc < w.acc+0.001 && d.n>=2) t += ` 특히 난이도 '${d.key}' 문항 정답률이 ${pct(d.acc)}입니다.`;
    if(s && s.acc < 0.5) t += ` 소단원 '${esc(s.key)}'(${pct(s.acc)})부터 개념을 다시 정리하세요.`;
    out.push(t);
  }
  const slow = aggregate(atts, a=>a.subject+'|'+a.unit).filter(o=>o.n>=3 && o.avgTime > avgT*1.5 && o.acc >= WEAK);
  for(const o of slow.slice(0,2)) out.push(`<b>${esc(o.sample.subject)} › ${esc(o.sample.unit)}</b>: 정답률은 ${pct(o.acc)}이지만 평균 ${fmtSec(o.avgTime)}로 전체 평균보다 오래 걸립니다. 시간 단축 연습이 필요합니다.`);
  const types = aggregate(atts, a=>a.type).filter(o=>o.n>=MIN_N).sort((a,b)=>a.acc-b.acc);
  if(types.length>1 && types[types.length-1].acc - types[0].acc >= 0.2) out.push(`유형별 편차: '${types[0].key}' 정답률(${pct(types[0].acc)})이 '${types[types.length-1].key}'(${pct(types[types.length-1].acc)})보다 크게 낮습니다.`);
  const wn = openWrong().length; if(wn) out.push(`해결하지 못한 오답이 ${wn}문항 있습니다. <a href="#" onclick="startWrongSession();return false">오답 다시 풀기</a>로 복습하세요.`);
  return out;
}
function drawCharts(groups, byDay){
  if(!window.Chart) return;
  const cs = getComputedStyle(document.documentElement), col = v=>cs.getPropertyValue(v).trim();
  Chart.defaults.color = col('--muted'); Chart.defaults.borderColor = col('--line'); Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const g = groups.slice().sort((a,b)=>a.acc-b.acc);
  charts.push(new Chart($('#c1'), {type:'bar', data:{labels:g.map(o=>o.key), datasets:[{data:g.map(o=>Math.round(o.acc*100)), backgroundColor:g.map(o=>o.n>=MIN_N && o.acc<WEAK ? col('--bad') : col('--primary')), borderRadius:4, maxBarThickness:28}]},
    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`정답률 ${c.raw}% (${g[c.dataIndex].n}문항)`}}}, scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'}}, y:{grid:{display:false}}}}}));
  charts.push(new Chart($('#c2'), {type:'line', data:{labels:byDay.map(o=>o.key.slice(5)), datasets:[{data:byDay.map(o=>Math.round(o.acc*100)), borderColor:col('--primary'), backgroundColor:col('--primary'), tension:.25, pointRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`정답률 ${c.raw}% (${byDay[c.dataIndex].n}문항)`}}}, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}, x:{grid:{display:false}}}}}));
}

/* =========================================================
   13. 공용 문제은행 (웹 호스팅 시 index.html 옆의 questions.xlsx 자동 동기화)
   - 파일 내용이 바뀌었을 때만 다시 불러옴 (해시 비교)
   - 공용 문항은 src:'shared'로 표시, 사용자가 직접 올린 개인 문항과 학습기록은 유지
   ========================================================= */
const SHARED_FILE = 'questions.xlsx';
const SHARED_INFO = {available:false, loading:false, error:null};
function hashBuf(buf){ const b = new Uint8Array(buf); let h = 0x811c9dc5; for(let i=0;i<b.length;i++){ h ^= b[i]; h = Math.imul(h, 0x01000193); } return (h>>>0).toString(16)+'-'+b.length; }
async function syncSharedBank(force){
  if(location.protocol==='file:' || !window.XLSX) return;
  SHARED_INFO.loading = true; let changed = false;
  try{
    const res = await fetch(SHARED_FILE, {cache:'no-cache'});
    if(!res.ok) return;                                   // 공용 파일이 없으면 개인용으로 동작
    SHARED_INFO.available = true;
    const buf = await res.arrayBuffer(), hash = hashBuf(buf);
    const had = DB.questions.filter(q=>q.src==='shared').length;
    if(!force && hash===DB.sharedHash && had) return;
    const wb = XLSX.read(buf, {type:'array'});
    const sh = wb.Sheets['문제'] || wb.Sheets[wb.SheetNames[0]];
    const {valid, errors} = await validateRows(XLSX.utils.sheet_to_json(sh, {defval:'', raw:false}), SHARED_FILE);
    if(!valid.length) throw new Error('유효한 문항이 없습니다');
    valid.forEach(q=>q.src='shared');
    const ids = new Set(valid.map(q=>q.id));
    DB.questions = [...valid, ...DB.questions.filter(q=>q.src!=='shared' && !ids.has(q.id))];
    DB.sharedHash = hash; SHARED_INFO.error = null; saveDB(); changed = true;
    toast(`공용 문제은행 ${valid.length}문항을 ${had?'업데이트했':'불러왔'}습니다${errors.length?` (오류 ${errors.length}행 제외)`:''}`);
  }catch(e){ console.warn(e); SHARED_INFO.error = e.message; changed = true; }
  finally{
    SHARED_INFO.loading = false;
    if((changed || !DB.questions.length || !syncSharedBank._once) && ['home','setup','upload'].includes(current)) VIEWS[current]();
    syncSharedBank._once = true;   // 풀이 중에는 화면을 건드리지 않음
  }
}

/* =========================================================
   14. 관리자 게시 (GitHub 저장소에 questions.xlsx / images 커밋)
   - 토큰은 관리자 브라우저에만 저장되며 코드·저장소에는 포함되지 않음
   - 게시 → GitHub Pages 재배포(약 1~2분) → 다른 사용자는 접속/새로고침 시 자동 반영
   ========================================================= */
const GH_KEY = 'tamgu_gh_admin';
function detectRepo(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(!m) return {owner:'', repo:''};
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner:m[1], repo: seg && !/\.html?$/i.test(seg) ? seg : m[1]+'.github.io'};
}
function loadGH(){
  let d = null;
  try{ d = JSON.parse(localStorage.getItem(GH_KEY) || sessionStorage.getItem(GH_KEY) || 'null'); }catch(e){}
  return Object.assign({...detectRepo(), branch:'main', token:'', remember:false, verified:false, login:''}, d||{});
}
let GH = loadGH();
function saveGH(){
  try{ localStorage.removeItem(GH_KEY); sessionStorage.removeItem(GH_KEY);
       if(GH.token) (GH.remember ? localStorage : sessionStorage).setItem(GH_KEY, JSON.stringify(GH)); }catch(e){}
}
const isAdmin = () => !!(GH.token && GH.verified);
const encPath = path => path.split('/').map(encodeURIComponent).join('/');
async function gh(path, {accept, allow404, ...init} = {}){
  const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}${path}`, {
    cache:'no-store', ...init,
    headers:{'Authorization':'Bearer '+GH.token, 'Accept':accept||'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(init.body?{'Content-Type':'application/json'}:{})}});
  if(!res.ok && !(allow404 && res.status===404)){
    let msg = ''; try{ msg = (await res.json()).message; }catch(e){}
    const hint = res.status===401 ? ' (토큰이 잘못되었거나 만료됨)' : res.status===403||res.status===404 ? ' (토큰에 이 저장소의 Contents 쓰기 권한이 있는지 확인)' : '';
    const err = new Error(`GitHub ${res.status} ${msg}${hint}`); err.status = res.status; throw err;
  }
  return res;
}
async function ghGetFile(path){
  const q = `/contents/${encPath(path)}?ref=${encodeURIComponent(GH.branch)}`;
  const meta = await gh(q, {allow404:true}); if(meta.status===404) return null;
  const j = await meta.json();
  const raw = await gh(q, {accept:'application/vnd.github.raw'});
  return {sha:j.sha, buf: await raw.arrayBuffer()};
}
async function ghPutFile(path, b64, sha, message){
  const r = await gh(`/contents/${encPath(path)}`, {method:'PUT', body: JSON.stringify({message, content:b64, branch:GH.branch, ...(sha?{sha}:{})})});
  return r.json();
}
const b64ToBuf = b64 => Uint8Array.from(atob(b64), c=>c.charCodeAt(0)).buffer;
const fileToB64 = f => new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(',')[1]); r.onerror = ()=>rej(r.error); r.readAsDataURL(f); });

/* 최신 공용 파일을 받아 mutator로 변경 후 커밋. 동시 게시 충돌(409/422) 시 1회 재시도 */
async function publishShared(mutator, message){
  if(!isAdmin()) throw new Error('관리자 연결이 필요합니다');
  for(let attempt=0; ; attempt++){
    const cur = await ghGetFile(SHARED_FILE);
    let qs = [];
    if(cur){ const wb = XLSX.read(cur.buf, {type:'array'}); const sh = wb.Sheets['문제'] || wb.Sheets[wb.SheetNames[0]];
             qs = (await validateRows(XLSX.utils.sheet_to_json(sh, {defval:'', raw:false}), SHARED_FILE)).valid; }
    const next = mutator(qs).map(q=>{ const c = {...q}; delete c.src; return c; });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...next.map(qToRow)]);
    ws['!cols'] = HEADERS.map(h=>({wch: h==='문제'?60: h==='해설'?40: h.startsWith('보기')?14:12}));
    XLSX.utils.book_append_sheet(wb, ws, '문제');
    const b64 = XLSX.write(wb, {type:'base64', bookType:'xlsx'});
    try{ await ghPutFile(SHARED_FILE, b64, cur?.sha, `[탐구문제] ${message}`); }
    catch(e){ if((e.status===409 || e.status===422) && attempt===0) continue; throw e; }
    // 내 화면에도 즉시 반영 (다음 동기화 때 같은 파일로 인식되도록 해시 저장)
    next.forEach(q=>q.src='shared'); const ids = new Set(next.map(q=>q.id));
    DB.questions = [...next, ...DB.questions.filter(q=>q.src!=='shared' && !ids.has(q.id))];
    DB.sharedHash = hashBuf(b64ToBuf(b64)); SHARED_INFO.available = true; saveDB();
    return next.length;
  }
}
async function publishImage(f){
  const path = 'images/' + f.name;
  const meta = await gh(`/contents/${encPath(path)}?ref=${encodeURIComponent(GH.branch)}`, {allow404:true});
  const sha = meta.status===404 ? null : (await meta.json()).sha;
  await ghPutFile(path, await fileToB64(f), sha, `[탐구문제] 이미지 게시: ${f.name}`);
}

      <li>Expiration: 90일 권장 · Repository access: <b>Only select repositories</b> → <b>${esc(GH.repo||'tamgu-quiz')}</b></li>
      <li>Permissions → Repository permissions → <b>Contents: Read and write</b> → Generate token</li>
      <li>생성된 토큰(github_pat_…)을 복사해 위 칸에 붙여넣고 [연결 확인]</li></ol>
      <div class="hint">공용 PC에서는 '이 기기에서 기억'을 끄세요 (브라우저를 닫으면 토큰이 지워집니다).</div></details></details>`;
}
function bindAdminCard(){
  const lo = $('#ghlogout');
  if(lo) lo.onclick = ()=>{ if(!confirm('관리자 연결을 해제하고 이 브라우저에서 토큰을 삭제할까요?')) return; GH.token=''; GH.verified=false; saveGH(); viewUpload(); };
  const vb = $('#ghverify'); if(!vb) return;
  vb.onclick = async ()=>{
    GH.owner = $('#ghowner').value.trim(); GH.repo = $('#ghrepo').value.trim(); GH.branch = $('#ghbranch').value.trim() || 'main';
    GH.token = $('#ghtoken').value.trim(); GH.remember = $('#ghremember').checked; GH.verified = false;
    if(!GH.owner || !GH.repo || !GH.token) return toast('계정, 저장소, 토큰을 모두 입력하세요');
    vb.disabled = true; vb.textContent = '확인 중…';
    try{
      const j = await (await gh('')).json();
      if(j.permissions && !j.permissions.push) throw new Error('이 계정에 저장소 쓰기 권한이 없습니다');
      GH.login = j.owner?.login || ''; GH.verified = true; saveGH();
      toast('관리자 연결 완료. 이제 업로드한 문제를 공용으로 게시할 수 있습니다', 5000); viewUpload();
    }catch(e){ GH.token=''; toast('연결 실패: '+e.message, 8000); vb.disabled = false; vb.textContent = '연결 확인'; }
  };
}

/* 다른 사용자: 탭으로 돌아올 때 공용 문제 변경 여부 확인 (풀이 중 제외) */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && current!=='quiz') syncSharedBank(false);
});

go('home');
syncSharedBank(false);
</script>
