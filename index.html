<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>탐구 문제풀이</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f5; --text:#1d2330; --muted:#667085; --line:#e2e5ea;
  --primary:#2f5bd3; --primary-weak:#e7edfb; --ok:#1f8a4c; --ok-weak:#e3f4ea; --bad:#c9302c; --bad-weak:#fbe7e6;
  --warn:#b7791f; --warn-weak:#fdf3e1; --shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161c; --surface:#1c2028; --surface2:#252a34; --text:#e7eaf0; --muted:#9aa3b2; --line:#323846;
    --primary:#7a9cff; --primary-weak:#25304d; --ok:#4cc27e; --ok-weak:#1d3328; --bad:#f2726c; --bad-weak:#3a2222;
    --warn:#e3b04f; --warn-weak:#3a3020; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#13161c; --surface:#1c2028; --surface2:#252a34; --text:#e7eaf0; --muted:#9aa3b2; --line:#323846;
  --primary:#7a9cff; --primary-weak:#25304d; --ok:#4cc27e; --ok-weak:#1d3328; --bad:#f2726c; --bad-weak:#3a2222;
  --warn:#e3b04f; --warn-weak:#3a3020; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;margin-right:auto;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:6px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--primary-weak);color:var(--primary);font-weight:600}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:16px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 16px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-bad{background:var(--bad-weak);color:var(--bad)} .b-ok{background:var(--ok-weak);color:var(--ok)}
.b-warn{background:var(--warn-weak);color:var(--warn)} .b-mute{background:var(--surface2);color:var(--muted)}
.b-pri{background:var(--primary-weak);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;user-select:none;background:var(--surface)}
.chip input{margin:0}
.chip.on{border-color:var(--primary);background:var(--primary-weak);color:var(--primary)}
.field{margin-bottom:16px}
.field>label.t{display:block;font-weight:600;margin-bottom:6px}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:140px;resize:vertical}
input[type=text].ans{width:100%;font-size:17px;padding:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over{border-color:var(--primary);background:var(--primary-weak)}
.weak-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.weak-item:last-child{border-bottom:0}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;max-width:220px}
.bar i{display:block;height:100%;background:var(--bad)}
/* quiz */
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.progress{height:6px;background:var(--surface2);border-radius:99px;margin:10px 0 16px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s}
.qtext{font-size:17px;line-height:1.75;margin-bottom:14px;word-break:keep-all;overflow-wrap:anywhere}
.qnum{font-weight:700;margin-right:4px}
.bogi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--surface2);position:relative;font-size:15.5px}
.bogi-t{display:block;text-align:center;font-weight:600;margin-bottom:6px}
.qimg{max-width:100%;border-radius:8px;border:1px solid var(--line);margin:8px 0;display:block}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--surface)}
.choice:hover{border-color:var(--primary)}
.choice.sel{border-color:var(--primary);background:var(--primary-weak)}
.choice.correct{border-color:var(--ok);background:var(--ok-weak)}
.choice.wrong{border-color:var(--bad);background:var(--bad-weak)}
.choice .no{font-weight:700;min-width:20px}
.choice.locked{cursor:default}
.fb{border-radius:10px;padding:14px 16px;margin-top:16px}
.fb.ok{background:var(--ok-weak);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-weak);border:1px solid var(--bad)}
.fb.neu{background:var(--surface2);border:1px solid var(--line)}
.fb .title{font-weight:700;font-size:17px;margin-bottom:4px}
.expl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.selfgrade{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text)}
.timer.low{color:var(--bad)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chartbox{position:relative;height:260px}
@media (max-width:720px){.charts{grid-template-columns:1fr}}
.list-q{border-bottom:1px solid var(--line);padding:12px 0}
.list-q:last-child{border-bottom:0}
.msg{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:13.5px}
.msg.err{background:var(--bad-weak);color:var(--bad)} .msg.wrn{background:var(--warn-weak);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 10px}
.empty p{color:var(--muted)}
details summary{cursor:pointer;color:var(--primary)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
.login{max-width:380px;margin:8vh auto 0}
.login input[type=text],.login input[type=password]{width:100%;margin-bottom:10px;padding:11px 12px}
.login .btn{width:100%;justify-content:center;padding:11px}
[hidden]{display:none!important}
.logtbl tr.logrow{cursor:pointer} .logtbl tr.logrow:hover td{background:var(--surface2)} .logtbl tr.logrow.open td{background:var(--primary-weak)}
.logtbl tr.logday td{background:var(--surface2);border-bottom:1px solid var(--line);padding:6px}
.logtbl tr.logdetail td{background:var(--surface2);padding:12px 14px}
.logq .qimg{max-width:420px}
.logtbl td:nth-child(1),.logtbl td:nth-child(4),.logtbl td:nth-child(7),.logtbl td:nth-child(8){white-space:nowrap}
.logtbl td:nth-child(2){min-width:110px} .logtbl td:nth-child(3){min-width:220px} .logtbl tr.logday td,.logtbl tr.logdetail td{white-space:normal}
#userbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
#mebtn{color:inherit;text-decoration:none;display:flex;align-items:center;gap:4px}
.gradegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gradecard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:14px;font:inherit;cursor:pointer}
.gradecard b{font-size:17px} .gradecard:hover{border-color:var(--primary)} .gradecard.on{border-color:var(--primary);background:var(--primary-weak)}
.utbl select{padding:4px 6px;font-size:13px}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo" onclick="go('home')">📘 탐구 문제풀이</div>
  <nav id="nav" hidden>
    <button data-v="home">홈</button>
    <button data-v="setup">문제풀기</button>
    <button data-v="analysis">분석</button>
    <button data-v="wrong">오답노트</button>
    <button data-v="log">풀이기록</button>
    <button data-v="upload" data-admin>문제관리</button>
    <button data-v="users" data-admin>사용자</button>
  </nav>
  <div id="userbox"></div>
</div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   1. 저장소 (localStorage + IndexedDB 이미지)
   ========================================================= */
const LS_BASE = 'tamgu_quiz_v1';
let LS_KEY = LS_BASE;                       // 로그인 후 'tamgu_quiz_v1:<아이디>'로 전환 (사용자별 학습기록 분리)
let DB = {questions:[], attempts:[], wrong:{}, settings:null, sharedHash:null};
function loadDB(){
  try{ const s = localStorage.getItem(LS_KEY); if(s){ const d = Object.assign({questions:[],attempts:[],wrong:{},settings:null,sharedHash:null,qTomb:{},resetAt:0,settingsMt:0,skips:{}}, JSON.parse(s));
    d.attempts.forEach(a=>{ if(!a.k) a.k = a.qid+'|'+a.ts; if(!a.grade) a.grade = 'h3'; });           // 학년 도입 이전 기록은 고3/재수생
    d.questions = (d.questions||[]).filter(q=>q.src!=='shared'); return d; } }catch(e){}
  return {questions:[], attempts:[], wrong:{}, settings:null};
}
function saveDB(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({...DB, questions: DB.questions.filter(q=>q.src!=='shared')})); }
  catch(e){ toast('⚠ 저장 실패: 브라우저 저장공간이 부족하거나 차단되었습니다. 백업을 내보내 주세요.'); }
}
const IMG = {
  db:null,
  open(){ return new Promise((res,rej)=>{ if(this.db) return res(this.db);
    try{ const r = indexedDB.open('tamgu_quiz_img',1);
      r.onupgradeneeded = ()=> r.result.createObjectStore('img');
      r.onsuccess = ()=>{ this.db = r.result; res(this.db); };
      r.onerror = ()=> rej(r.error);
    }catch(e){ rej(e); } }); },
  async put(k,v){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction('img','readwrite'); t.objectStore('img').put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); },
  async get(k){ try{ const db = await this.open(); return await new Promise(res=>{ const r = db.transaction('img').objectStore('img').get(k); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }catch(e){ return null; } },
  async keys(){ try{ const db = await this.open(); return await new Promise(res=>{ const r = db.transaction('img').objectStore('img').getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); }catch(e){ return []; } },
  async clear(){ try{ const db = await this.open(); return await new Promise(res=>{ const t = db.transaction('img','readwrite'); t.objectStore('img').clear(); t.oncomplete=res; t.onerror=res; }); }catch(e){} }
};

/* =========================================================
   2. 공통 유틸
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧'];
const TYPES = ['객관식','단답형','서술형'];
const DIFFS = ['상','중','하'];
const pct = v => v==null || isNaN(v) ? '-' : Math.round(v*100)+'%';
const fmtSec = s => { s = Math.round(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function toast(m, ms=2600){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), ms); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 텍스트 → HTML (줄바꿈, 〈보기〉 박스) + 수식 렌더링 */
function rich(s){ return esc(s).replace(/\r?\n/g,'<br>'); }
function qTextHTML(text){
  // 한 줄에 '〈보기〉'만 단독으로 있을 때 그 아래를 보기 박스로 표시 (문장 속 '〈보기〉에서'는 그대로 둠)
  const s = String(text||''), m = s.match(/\r?\n[ \t]*[〈<]\s*보\s*기\s*[〉>][ \t]*(\r?\n|$)/);
  if(!m) return rich(s);
  return rich(s.slice(0, m.index)) + `<div class="bogi"><span class="bogi-t">〈보 기〉</span>${rich(s.slice(m.index + m[0].length))}</div>`;
}
function renderMath(el){
  if(window.renderMathInElement){
    try{ renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}], throwOnError:false}); }catch(e){}
  }
}
async function hydrateImages(el){
  for(const img of el.querySelectorAll('img[data-img]')){
    const k = img.dataset.img;
    if(/^(https?:|data:)/i.test(k)){ img.src = k; continue; }
    const blob = await IMG.get(k);
    if(blob){ img.src = URL.createObjectURL(blob); continue; }
    try{
      if(!SB.session) throw new Error(); await sbEnsure();
      const r = await fetch(`${SB_URL}/storage/v1/object/authenticated/qimages/${encodeURIComponent(k)}`, {headers:{apikey:SB_KEY, Authorization:'Bearer '+SB.session.access_token}});
      if(!r.ok) throw new Error();
      img.src = URL.createObjectURL(await r.blob());
    }catch(e){
      img.replaceWith(Object.assign(document.createElement('div'),{className:'msg wrn',textContent:`이미지 '${k}'를 찾을 수 없습니다. (관리자 이미지 업로드 여부 확인)`}));
    }
  }
}
function imgHTML(q){ return q.image ? `<img class="qimg" data-img="${esc(q.image)}" alt="문제 이미지">` : ''; }

/* =========================================================
   3. 통계 엔진
   ========================================================= */
function aggregate(atts, keyFn){
  const m = new Map();
  for(const a of atts){ const k = keyFn(a); if(k==null) continue;
    let o = m.get(k); if(!o){ o = {key:k,n:0,sum:0,time:0,sample:a}; m.set(k,o); }
    o.n++; o.sum += a.score; o.time += a.time||0; }
  for(const o of m.values()){ o.acc = o.sum/o.n; o.avgTime = o.time/o.n; }
  return [...m.values()];
}
const MIN_N = 5, WEAK = 0.6, GOOD = 0.8;
function judge(o){
  if(o.n < MIN_N) return '<span class="badge b-mute">표본부족</span>';
  if(o.acc < WEAK) return '<span class="badge b-bad">🔴 취약</span>';
  if(o.acc < GOOD) return '<span class="badge b-warn">🟡 보통</span>';
  return '<span class="badge b-ok">🟢 양호</span>';
}
const gAtts = () => DB.attempts.filter(a=>(a.grade||'h3')===AUTH.grade);            // 현재 학년 풀이기록
function unitAccMap(){ const r = {}; for(const o of aggregate(gAtts(), a=>a.subject+'|'+a.unit)) r[o.key] = o.acc; return r; }
function weakUnits(atts, limit=3){
  return aggregate(atts, a=>a.subject+'|'+a.unit).filter(o=>o.n>=MIN_N && o.acc<WEAK).sort((a,b)=>a.acc-b.acc||b.n-a.n).slice(0,limit);
}
function streakDays(){
  const days = new Set(DB.attempts.map(a=>dayKey(a.ts)));
  let d = new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  let n = 0; while(days.has(dayKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
const openWrong = () => Object.entries(DB.wrong).filter(([id,w])=>!w.deleted && !w.cleared && DB.questions.some(q=>q.id===id));

/* =========================================================
   4. 라우팅
   ========================================================= */
let current = 'home', session = null, timerId = null, charts = [];
const VIEWS = {home:viewHome, upload:viewUpload, setup:viewSetup, quiz:viewQuiz, result:viewResult, analysis:viewAnalysis, wrong:viewWrong, log:viewLog, me:viewMe, users:viewUsers};
function go(v){
  if(!AUTH) return viewLogin();
  if(['upload','users'].includes(v) && AUTH.role!=='admin') v = 'home';
  if(current==='quiz' && v!=='quiz' && v!=='result' && session && !session.done){
    if(!confirm('풀이 중인 세션을 종료할까요? 지금까지 제출한 답은 저장됩니다.')) return;
    finishSession(false);
  }
  current = v; charts.forEach(c=>c.destroy()); charts = [];
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===v || (v==='quiz'&&b.dataset.v==='setup') || (v==='result'&&b.dataset.v==='setup')));
  VIEWS[v](); window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

/* =========================================================
   5. 홈
   ========================================================= */
function viewHome(){
  if(!AUTH.grade){
    $('#app').innerHTML = `<div class="card"><h2>🎓 학년을 선택하세요</h2><p class="muted">선택한 학년의 문제은행으로 문제가 출제됩니다. 나중에 [내 정보]에서 바꿀 수 있습니다.</p>${gradeGridHTML()}</div>`;
    bindGradeGrid(); return;
  }
  const atts = gAtts(), nQ = DB.questions.length;
  if(!nQ){
    $('#app').innerHTML = BANK.loading ? `<div class="card empty"><h2>${esc(gradeName(AUTH.grade))} 문제은행을 불러오는 중…</h2></div>`
      : `${legacyCardHTML(true)}<div class="card empty"><h2>🎓 ${esc(gradeName(AUTH.grade))} 문제은행에 등록된 문제가 없습니다</h2>
        ${BANK.error?`<div class="msg err">${esc(BANK.error)}</div>`:''}
        <p class="muted">${AUTH.role==='admin' ? '[문제관리]에서 이 학년의 과목별 문제를 등록하세요.' : '관리자가 문제를 등록하면 이곳에 표시됩니다. 학년이 맞는지 [내 정보]에서 확인하세요.'}</p>
        <div class="row" style="justify-content:center;margin-top:16px">
          ${AUTH.role==='admin' ? `<button class="btn pri" onclick="go('upload')">문제관리로 이동</button>` : ''}
          <button class="btn" onclick="go('me')">학년 변경</button></div></div>`;
    bindLegacy(); return;
  }
  const subs = [...new Set(DB.questions.map(q=>q.subject))];
  const acc = atts.length ? atts.reduce((s,a)=>s+a.score,0)/atts.length : null;
  const weak = weakUnits(atts);
  const wn = openWrong().length;
  $('#app').innerHTML = `${legacyCardHTML(true)}
    <div class="kpis">
      <div class="kpi"><div class="l">🎓 ${esc(gradeName(AUTH.grade))} 문제은행</div><div class="v">${nQ}</div><div class="small muted">${subs.length}과목</div></div>
      <div class="kpi"><div class="l">누적 풀이</div><div class="v">${atts.length}</div></div>
      <div class="kpi"><div class="l">전체 정답률</div><div class="v">${pct(acc)}</div></div>
      <div class="kpi"><div class="l">연속 학습</div><div class="v">${streakDays()}일</div></div>
      <div class="kpi"><div class="l">미해결 오답</div><div class="v">${wn}</div></div>
    </div>
    <div class="card">
      <h3>⚠ 취약 영역 Top 3</h3>
      ${weak.length ? weak.map((o,i)=>`<div class="weak-item"><b>${i+1}.</b><span>${esc(o.sample.subject)} &gt; ${esc(o.sample.unit)}</span><span class="sp"></span>
          <div class="bar"><i style="width:${Math.round(o.acc*100)}%"></i></div><b style="min-width:44px;text-align:right">${pct(o.acc)}</b><span class="muted small">(${o.n}문항)</span></div>`).join('')
        : `<p class="muted">${atts.length ? `정답률 ${WEAK*100}% 미만인 단원이 없습니다. (단원별 ${MIN_N}문항 이상 풀어야 판정됩니다)` : '아직 풀이 기록이 없습니다. 문제를 풀면 취약 영역을 자동으로 분석합니다.'}</p>`}
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn pri" onclick="go('setup')">▶ 새로 풀기</button>
      <button class="btn" onclick="startWrongSession()" ${wn?'':'disabled'}>↻ 오답만 다시 풀기 (${wn})</button>
      <button class="btn" onclick="go('analysis')">📊 분석 리포트</button>
    </div>`;
  bindLegacy();
}

const COLMAP = {'문항id':'id','id':'id','과목':'subject','대단원':'unit','단원':'unit','소단원':'subunit','유형':'type','난이도':'difficulty','문제':'text','이미지':'image',
  '보기1':'c1','보기2':'c2','보기3':'c3','보기4':'c4','보기5':'c5','선택지1':'c1','선택지2':'c2','선택지3':'c3','선택지4':'c4','선택지5':'c5','정답':'answer','해설':'explanation','배점':'points','채점기준':'criteria'};
function normType(t){ t = String(t||'').replace(/\s/g,'');
  if(/객관|선다|5지|오지/.test(t)) return '객관식';
  if(/단답|주관/.test(t)) return '단답형';
  if(/서술|논술/.test(t)) return '서술형';
  return null; }
let pending = null;
const GRADES = [['m1','중1'],['m2','중2'],['m3','중3'],['h1','고1'],['h2','고2'],['h3','고3/재수생']];
const gradeName = c => (GRADES.find(g=>g[0]===c)||[null,'학년 미선택'])[1];
const BM = {grade:null, loadedGrade:null, banks:[], questions:[], loading:false, error:null};   // 관리자 문제관리 화면 상태
const fmtDT = v => v ? new Date(v).toLocaleString('ko-KR',{dateStyle:'short',timeStyle:'short'}) : '-';

  BM.loading = false; BM.loadedGrade = BM.grade;
}

    toast(`이미지 ${n}개를 올렸습니다${fail.length?` (실패 ${fail.length}: ${fail[0]})`:''}`, 6000); e.target.value = '';
  };
  document.querySelectorAll('[data-bexp]').forEach(b=>b.onclick=()=>{ const bk = BM.banks.find(x=>String(x.id)===b.dataset.bexp); exportBankXlsx(bk, BM.questions.filter(q=>q.bankId===bk.id)); });
  document.querySelectorAll('[data-bdel]').forEach(b=>b.onclick=async()=>{
    const bk = BM.banks.find(x=>String(x.id)===b.dataset.bdel);
    if(!confirm(`${gradeName(bk.grade)} · ${bk.subject} 문제은행(${bk.question_count}문항)을 삭제합니다.\n이 학년 사용자에게서 해당 과목 문제가 사라집니다. (풀이기록은 보존)\n계속할까요?`)) return;
    b.disabled = true;

         toast(`'${bk.subject}' 문제은행을 삭제했습니다`); await afterBankChange(); }
    catch(e){ toast('삭제 실패: '+e.message, 6000); b.disabled = false; }
  });
  bindLegacy();
  if(pending) renderPending();
}
async function afterBankChange(){
  BM.loadedGrade = null; await loadBM();
  if(BM.grade===AUTH.grade){ BANK.sig = null; await syncBank(true); }
  if(current==='upload') viewUpload();
}
function exportBankXlsx(bank, qs){
  if(!window.XLSX) return toast('엑셀 라이브러리를 불러오지 못했습니다');
  const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...qs.map(qToRow)]);
  ws['!cols'] = HEADERS.map(h=>({wch: h==='문제'?60: h==='해설'?40: h.startsWith('보기')?14:12}));
  XLSX.utils.book_append_sheet(wb, ws, '문제'); XLSX.writeFile(wb, `${bank.grade}_${bank.subject}_${dayKey(Date.now())}.xlsx`);
}

function gradeGridHTML(){ return `<div class="gradegrid">${GRADES.map(([c,n])=>`<button class="gradecard ${AUTH.grade===c?'on':''}" data-g="${c}"><b>${n}</b><span class="small muted" data-gs="${c}">…</span></button>`).join('')}</div>`; }
function bindGradeGrid(){
  document.querySelectorAll('.gradecard').forEach(b=>b.onclick=()=>setGrade(b.dataset.g));
  fetchBanks().then(all=>{ for(const [c] of GRADES){ const bs = all.filter(b=>b.grade===c), n = bs.reduce((x,b)=>x+b.question_count,0), el = document.querySelector(`[data-gs="${c}"]`);
    if(el) el.textContent = bs.length ? `${bs.length}과목 · ${n}문항` : '문제 준비 중'; } }).catch(()=>{});
}
async function setGrade(c){
  if(c===AUTH.grade){ if(current!=='home') go('home'); return; }
  try{ await sbFetch('/rest/v1/rpc/set_my_grade', {method:'POST', body:{p_grade:c}}); }
  catch(e){ return toast('학년 변경 실패: '+e.message, 6000); }
  AUTH.grade = c; persistAuth(); cfg = null; DB.settings = null;
  DB.questions = DB.questions.filter(q=>q.src!=='shared'); BANK.sig = null; anaF.grade = logF.grade = c;
  renderUserbox(); toast(`🎓 ${gradeName(c)} 문제은행으로 변경했습니다`);
  go('home'); await syncBank(true);
}

async function readQuestionFile(f){
  if(!window.XLSX){ toast('엑셀 처리 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.'); return; }
  try{
    let wb;
    if(/\.csv$/i.test(f.name)){
      const buf = await f.arrayBuffer();
      let txt = new TextDecoder('utf-8').decode(buf);
      if(txt.includes('�')) txt = new TextDecoder('euc-kr').decode(buf);   // 엑셀 CSV(CP949) 대응
      wb = XLSX.read(txt.replace(/^﻿/,''), {type:'string', raw:true});
    } else {
      wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    }
    const sh = wb.Sheets['문제'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sh, {defval:'', raw:false});
    pending = await validateRows(rows, f.name);
    renderPending();
  }catch(e){ console.error(e); toast('파일을 읽지 못했습니다: '+e.message); }
}

async function validateRows(rows, fname){
  const valid = [], errors = [], warnings = [], seen = new Set();
  const existing = new Set(BM.questions.map(q=>q.id));
  let overwrite = 0;
  rows.forEach((r, i)=>{
    const line = i+2, o = {};
    for(const [k,v] of Object.entries(r)){ const key = COLMAP[String(k).replace(/\s/g,'').toLowerCase()]; if(key) o[key] = String(v??'').trim(); }
    if(!Object.values(o).some(v=>v)) return;                                  // 빈 행
    const err = m => errors.push(`${line}행: ${m}`), wrn = m => warnings.push(`${line}행: ${m}`);
    const type = normType(o.type);
    if(!o.subject) return err('과목이 비어 있습니다');
    if(!o.unit) return err('대단원이 비어 있습니다');
    if(!o.text) return err('문제가 비어 있습니다');
    if(!type) return err(`유형 '${o.type}'을(를) 알 수 없습니다 (객관식/단답형/서술형)`);
    if(!o.answer) return err(type==='서술형' ? '정답(모범답안)이 비어 있습니다' : '정답이 비어 있습니다');
    const q = {id:o.id, subject:o.subject, unit:o.unit, subunit:o.subunit||'', type, difficulty:o.difficulty, text:o.text, image:o.image||'',
               choices:[], answer:o.answer, explanation:o.explanation||'', points:Number(o.points)||(type==='객관식'?2:3), criteria:o.criteria||''};
    if(!DIFFS.includes(q.difficulty)){ if(o.difficulty) wrn(`난이도 '${o.difficulty}' → '중'으로 처리`); q.difficulty='중'; }
    if(type==='객관식'){
      const cs = [o.c1,o.c2,o.c3,o.c4,o.c5]; let last = cs.length; while(last>0 && !cs[last-1]) last--;
      q.choices = cs.slice(0,last);
      if(q.choices.length < 2) return err('객관식은 보기가 2개 이상 필요합니다');
      if(q.choices.some(c=>!c)) return err('보기 중간에 빈 칸이 있습니다');
      const a = String(q.answer).replace(/[①②③④⑤]/g, c=>CIRCLED.indexOf(c)+1).replace(/[^0-9]/g,'');
      if(!a || +a<1 || +a>q.choices.length) return err(`정답 '${o.answer}'이(가) 보기 번호(1~${q.choices.length}) 범위를 벗어났습니다`);
      q.answer = String(+a);
      if(q.choices.length !== 5) wrn(`보기가 ${q.choices.length}개입니다`);
    }
    if(type==='서술형' && !q.criteria) wrn('서술형 채점기준(키워드)이 없어 자동 예비채점이 생략됩니다');
    if(!q.id){ q.id = `${(BM.grade||'x').toUpperCase()}-${q.subject}-R${line}`; wrn(`문항ID가 없어 '${q.id}'로 자동 생성`); }
    if(seen.has(q.id)) wrn(`문항ID '${q.id}' 중복 → 아래쪽 행으로 덮어씀`);
    if(existing.has(q.id)) overwrite++;
    seen.add(q.id);
    const idx = valid.findIndex(v=>v.id===q.id); if(idx>=0) valid[idx]=q; else valid.push(q);
  });
  return {fname, valid, errors, warnings, overwrite};
}

function renderPending(){

  const target = subs.map(sub=>{ const b = BM.banks.find(x=>x.subject===sub); return `<b>${esc(sub)}</b> ${b?`<span class="muted">(기존 ${b.question_count}문항)</span>`:'<span class="badge b-pri">신규 과목</span>'}`; }).join(' · ');

    ${p.errors.length?`<div style="margin-top:8px"><div class="small muted">오류 행은 저장되지 않습니다.</div>${list(p.errors,'err')}</div>`:''}
    ${p.warnings.length?`<details style="margin-top:8px"><summary>경고 ${p.warnings.length}건 보기</summary>${list(p.warnings,'wrn')}</details>`:''}
    ${p.conflicts?`<div style="margin-top:8px"><div class="msg err"><b>문항ID 중복으로 등록할 수 없습니다.</b> 다른 학년 문제은행에 같은 ID가 있습니다. 파일의 ID를 바꿔 다시 올려 주세요.</div>${list(p.conflicts,'err')}</div>`:''}
    ${subs.length?`<div class="msg" style="background:var(--surface2);margin-top:10px">등록 대상: <b>🎓 ${esc(gradeName(BM.grade))}</b> · ${target}</div>`:''}
    <div class="row" style="margin-top:8px">
      <label><input type="radio" name="mode" value="add" checked> 추가 (같은 ID는 수정 내용으로 덮어쓰기${p.overwrite?` · ${p.overwrite}건`:''})</label>
      <label><input type="radio" name="mode" value="replace"> 파일에 있는 과목만 교체</label>
      <span class="sp"></span>
      <button class="btn" onclick="pending=null;renderPending()">취소</button>
      <button class="btn pri" id="commit" ${p.valid.length?'':'disabled'}>${p.valid.length}문항 등록</button>
    </div></div>`;
  $('#commit').onclick = async ()=>{
    const mode = document.querySelector('input[name=mode]:checked').value;
    if(mode==='replace'){
      const lost = subs.map(sub=>{ const b = BM.banks.find(x=>x.subject===sub); return b ? `· ${sub}: 기존 ${b.question_count}문항 → 이 파일의 ${p.valid.filter(q=>q.subject===sub).length}문항` : null; }).filter(Boolean);
      if(!confirm(`${gradeName(BM.grade)}에서 다음 과목의 기존 문항을 모두 지우고 이 파일 내용으로 바꿉니다.\n${lost.join('\n')||'(기존 문항 없음)'}\n다른 과목은 그대로 유지됩니다. 계속할까요?`)) return;
    }
    const btn = $('#commit'); btn.disabled = true; btn.textContent = '등록 중…';
    try{
      const r = await publishToBank(BM.grade, p.valid, mode);
      toast(`${gradeName(BM.grade)} · ${r.subjects.join(', ')}에 ${r.count}문항을 등록했습니다`, 6000);
      pending = null; await afterBankChange();
    }catch(e){
      if(e.list){ p.conflicts = e.list; renderPending(); }
      toast('등록 실패: '+e.message, 8000); btn.disabled = false; btn.textContent = `${p.valid.length}문항 등록`;
    }
  };
}

      <div class="hint">취약 단원 가중: 정답률이 낮은 단원의 문제가 더 자주 나옵니다. 선택지 섞기는 '①, ②' 등 번호를 참조하는 보기가 있으면 끄세요.</div>
      <div class="hint">건너뛴 문제 제외: 풀이 중 [건너뛰기]한 문제(너무 쉬움·오류·불필요)를 출제와 오답 다시 풀기에서 뺍니다. 나중에 다시 풀어 맞히거나 틀리면 자동으로 해제됩니다.
        ${skippedCount()?`<a href="#" id="skipclear">건너뛴 기록 ${skippedCount()}개 모두 해제</a>`:''}</div></div>
    <div class="row"><span id="poolinfo" class="muted"></span><span class="sp"></span><button class="btn pri" id="start">시작하기 ▶</button></div></div>`;
  const renderUnits = ()=>{
    const units = []; const seen = new Set();
    for(const q of DB.questions) if(cfg.subjects.includes(q.subject)){ const k=q.subject+'|'+q.unit; if(!seen.has(k)){ seen.add(k); units.push(k); } }
    $('#units').innerHTML = `<div class="chips">${units.map(k=>chip('units',k,!cfg.unitsOff.includes(k),(cfg.subjects.length>1?k.split('|')[0]+' · ':'')+k.split('|')[1])).join('')}</div>`;
    bind(); updateInfo();
  };
  const updateInfo = ()=>{ const n = buildPool(cfg).length; $('#poolinfo').textContent = `조건에 맞는 문항: ${n}개`; $('#start').disabled = !n; };
  const bind = ()=> document.querySelectorAll('#app input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const g = cb.dataset.g, v = cb.value; cb.parentElement.classList.toggle('on', cb.checked);
    if(g==='opt') cfg[v] = cb.checked;
    else if(g==='units'){ cfg.unitsOff = cfg.unitsOff.filter(x=>x!==v); if(!cb.checked) cfg.unitsOff.push(v); }
    else { cfg[g] = cfg[g].filter(x=>x!==v); if(cb.checked) cfg[g].push(v); }
    if(g==='subjects') renderUnits(); else updateInfo();
  });
  $('#uall').onclick = ()=>{ cfg.unitsOff=[]; renderUnits(); };
  $('#unone').onclick = ()=>{ cfg.unitsOff = [...new Set(DB.questions.filter(q=>cfg.subjects.includes(q.subject)).map(q=>q.subject+'|'+q.unit))]; renderUnits(); };
  $('#cnt').oninput = e=>{ cfg.count = Math.max(1, +e.target.value||1); };
  const sc = $('#skipclear'); if(sc) sc.onclick = e=>{ e.preventDefault(); if(confirm(`건너뛴 문제 ${skippedCount()}개의 표시를 모두 해제할까요? 다시 출제 대상에 포함됩니다.`)){ clearSkipped(); toast('건너뛴 표시를 해제했습니다'); viewSetup(); } };
  $('#lim').onchange = e=>{ cfg.limit = +e.target.value; };
  $('#start').onclick = ()=>{
    const pool = buildPool(cfg); const qs = sample(pool, Math.min(cfg.count, pool.length), cfg.weighted);
    DB.settings = cfg; DB.settingsMt = Date.now(); saveDB(); scheduleRecordSync();
    if(pool.length < cfg.count) toast(`조건에 맞는 문항이 ${pool.length}개라 ${pool.length}문항으로 출제합니다`);
    startSession(qs, {limit:cfg.limit, shuffle:cfg.shuffle, mode:'normal'});
  };
  renderUnits();
}
function buildPool(c){
  const correct = new Set(DB.attempts.filter(a=>a.score===1).map(a=>a.qid));
  return DB.questions.filter(q=>c.subjects.includes(q.subject) && !c.unitsOff.includes(q.subject+'|'+q.unit) && c.types.includes(q.type) && c.diffs.includes(q.difficulty) && !(c.excludeCorrect && correct.has(q.id)) && !(c.excludeSkipped && isSkipped(q.id)));
}
/* 가중치 비복원 추출: weight = 0.2 + (1 - 단원 정답률), 기록 없는 단원은 정답률 0.5로 간주 */
function sample(pool, n, weighted){
  const acc = weighted ? unitAccMap() : {};
  const items = pool.map(q=>({q, w: weighted ? 0.2 + (1 - (acc[q.subject+'|'+q.unit] ?? 0.5)) : 1}));
  const out = [];
  while(out.length < n && items.length){
    let r = Math.random() * items.reduce((s,x)=>s+x.w,0), i = 0;
    for(; i<items.length-1; i++){ r -= items[i].w; if(r <= 0) break; }
    out.push(items.splice(i,1)[0].q);
  }
  return out;
}

function startSession(qs, opt){
  if(!qs.length) return toast('출제할 문제가 없습니다');
  session = {id:'S'+Date.now().toString(36), items:qs.map(q=>({q, perm: (opt.shuffle && q.type==='객관식') ? shuffle(q.choices.map((_,i)=>i)) : q.choices.map((_,i)=>i), att:null})),
             idx:0, start:Date.now(), limit:(opt.limit||0)*60000, mode:opt.mode, skipped:0, done:false};
  clearInterval(timerId);
  if(session.limit) timerId = setInterval(tick, 1000);
  current = 'quiz'; go('quiz');
}
function startWrongSession(){
  const exSkip = (cfg || DB.settings || {}).excludeSkipped;
  const ids = openWrong().map(([id])=>id).filter(id=>!(exSkip && isSkipped(id)));
  const qs = shuffle(DB.questions.filter(q=>ids.includes(q.id)));
  if(!qs.length) return toast('다시 풀 오답이 없습니다');
  startSession(qs, {limit:0, shuffle:false, mode:'wrong'});
}
function tick(){
  if(!session || session.done){ clearInterval(timerId); return; }

  if(el){ el.textContent = '⏱ 남은 시간 ' + fmtSec(Math.max(0,left)/1000); el.classList.toggle('low', left < 60000); }
  if(left <= 0){ toast('제한시간이 끝났습니다'); finishSession(true); }
}

/* 채점 */
function normAns(s){
  return String(s??'').normalize('NFKC').toLowerCase().replace(/[×✕✖]/g,'x').replace(/\*/g,'x').replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/[.。,]+$/,'');
}
function gradeShort(user, answer){
  const u = normAns(user); if(!u) return false;
  return String(answer).split('|').some(a=>{
    const n = normAns(a); if(!n) return false;
    if(u===n) return true;
    const un = Number(u), an = Number(n);
    return !isNaN(un) && !isNaN(an) && Math.abs(un-an) < 1e-9;
  });
}
function keywordCheck(user, criteria){
  const kws = String(criteria||'').split(/[,|\n;]/).map(s=>s.trim()).filter(Boolean);
  const u = normAns(user);
  return kws.map(k=>({k, hit: u.includes(normAns(k))}));
}
function submit(){
  const it = session.items[session.idx], q = it.q, time = (Date.now()-qStart)/1000;
  if(q.type==='객관식'){
    const userOrig = it.perm[selected]+1, ok = String(userOrig)===String(q.answer);
    const correctK = it.perm.indexOf(+q.answer-1);
    document.querySelectorAll('.choice').forEach(c=>{ const k=+c.dataset.k; c.classList.add('locked'); c.classList.remove('sel');
      if(k===correctK) c.classList.add('correct'); else if(k===selected) c.classList.add('wrong'); });
    record(it, ok?1:0, String(userOrig), time);
    showFeedback(ok, `내 답: ${CIRCLED[selected]} · 정답: ${CIRCLED[correctK]}`, it);
  } else if(q.type==='단답형'){
    const user = $('#uans').value.trim(), ok = gradeShort(user, q.answer);
    $('#uans').disabled = true;
    record(it, ok?1:0, user, time);
    showFeedback(ok, `내 답: ${esc(user)} · 정답: ${q.answer.split('|').map(esc).join(' / ')}`, it, !ok);
  } else {
    const user = $('#uans').value.trim(); $('#uans').disabled = true;
    const kc = keywordCheck(user, q.criteria), hit = kc.filter(x=>x.hit).length, ratio = kc.length ? hit/kc.length : null;
    const suggest = ratio==null ? null : ratio>=0.7 ? 1 : ratio>=0.4 ? 0.5 : 0;
    phase = 'grading';
    $('#actions').innerHTML = '';
    $('#fb').innerHTML = `<div class="fb neu">
      <div class="title">📝 모범답안과 비교해 스스로 채점하세요</div>
      <div><b>모범답안</b><br>${rich(q.answer)}</div>
      ${kc.length?`<div class="expl"><b>핵심 키워드 자동 점검</b> — ${hit}/${kc.length}개 포함 (예비점수 ${Math.round(ratio*100)}%)<br>
        ${kc.map(x=>`<span class="badge ${x.hit?'b-ok':'b-bad'}" style="margin:3px 3px 0 0">${x.hit?'✔':'✖'} ${esc(x.k)}</span>`).join('')}</div>`:''}
      ${q.explanation?`<div class="expl"><b>해설</b><br>${rich(q.explanation)}</div>`:''}
      <div class="selfgrade">
        ${[[1,'○ 맞음 (100%)','ok'],[0.5,'△ 부분 (50%)','warn'],[0,'× 틀림 (0%)','bad']].map(([v,l])=>`<button class="btn ${suggest===v?'pri':''}" data-sg="${v}">${l}${suggest===v?' · 추천':''}</button>`).join('')}
      </div></div>`;
    renderMath($('#fb'));
    document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{
      const sc = +b.dataset.sg; record(it, sc, user, time);
      document.querySelectorAll('[data-sg]').forEach(x=>{ x.disabled=true; x.classList.toggle('pri', x===b); });
      phase = 'done'; addNextButton(it);
    });
  }
}
function record(it, score, answer, time){
  const q = it.q;
  const a = {qid:q.id, subject:q.subject, unit:q.unit, subunit:q.subunit, type:q.type, difficulty:q.difficulty, points:q.points, score, answer, time:Math.round(time), ts:Date.now(), sid:session.id, grade:q.grade||AUTH.grade};
  a.k = a.qid+'|'+a.ts; a.mt = a.ts; unmarkSkipped(q.id);
  DB.attempts.push(a); it.att = a;
  const w0 = DB.wrong[q.id], w = w0 && !w0.deleted ? w0 : null;
  if(score < 1){ DB.wrong[q.id] = {count:(w?.count||0)+1, lastTs:a.ts, cleared:false, starred:w?.starred||false, mt:a.ts}; }
  else if(w){ w.cleared = true; w.mt = a.ts; }
  saveDB(); scheduleRecordSync();
}
function showFeedback(ok, line, it, allowAppeal){
  const q = it.q; phase = 'done';
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}">
    <div class="title">${ok?'⭕ 정답입니다!':'❌ 오답입니다.'}</div><div>${line}</div>
    ${q.explanation?`<div class="expl"><b>📖 해설</b><br>${rich(q.explanation)}</div>`:''}
    <div class="row" style="margin-top:10px">
      ${allowAppeal?'<button class="btn sm" id="appeal">내 답도 맞아요 (정답 인정)</button>':''}
      <button class="btn sm" id="star">${DB.wrong[q.id]?.starred && !DB.wrong[q.id]?.deleted?'★ 오답노트 저장됨':'☆ 오답노트에 저장'}</button></div></div>`;
  renderMath($('#fb'));
  $('#star').onclick = ()=>{ let w = DB.wrong[q.id]; if(!w || w.deleted) w = DB.wrong[q.id] = {count:0,lastTs:Date.now(),cleared:false,starred:false};
    w.starred = true; w.cleared = false; w.mt = Date.now(); saveDB(); scheduleRecordSync(); $('#star').textContent='★ 오답노트 저장됨'; };
  if(allowAppeal) $('#appeal').onclick = ()=>{
    const a = it.att; a.score = 1; a.appealed = true; a.mt = Date.now(); const w = DB.wrong[q.id];
    if(w && !w.deleted){ w.count = Math.max(0, w.count-1); if(w.count===0 && !w.starred) DB.wrong[q.id] = {deleted:true, mt:Date.now()}; else { w.cleared = true; w.mt = Date.now(); } }
    scheduleRecordSync();
    saveDB(); const f = $('#fb .fb'); f.className='fb ok'; f.querySelector('.title').textContent='⭕ 정답으로 인정했습니다'; $('#appeal').remove();
  };
  $('#actions').innerHTML = ''; addNextButton(it);
}
function addNextButton(){
  const last = session.idx >= session.items.length-1;
  $('#actions').innerHTML = `<span class="sp"></span><button class="btn pri" id="next">${last?'결과 보기':'다음 문제 ▶'}</button>`;

function nextQ(){ if(session.idx >= session.items.length-1) return finishSession(true); session.idx++; viewQuiz(); window.scrollTo(0,0); }
function finishSession(show){
  if(!session) return; session.done = true; session.end = Date.now(); clearInterval(timerId); syncRecords();

}

  ANA_CACHE[login] = m && m.user_id ? (await sbAll('attempts', `select=*&user_id=eq.${m.user_id}&order=id.asc`)).map(rowToAttempt) : [];

      loadUserAttempts(anaF.user).then(()=>{ if(current==='analysis') viewAnalysis(); }).catch(e=>{ toast('불러오기 실패: '+e.message, 6000); anaF.user = AUTH.id; viewAnalysis(); }); return; }
  }
  const subs = [...new Set(source.map(a=>a.subject))];

  const head = `${isAdm?'<div class="card" id="usum"><div class="small muted">사용자별 현황 불러오는 중…</div></div>':''}
    <div class="row" style="margin-bottom:14px"><h2 style="margin:0">분석 리포트${other?` <span class="badge b-warn">${esc(anaF.user)}</span>`:''}</h2><span class="sp"></span>${userSel}
    <select id="fg"><option value="">전체 학년</option>${GRADES.filter(([c])=>grades.includes(c)||c===anaF.grade).map(([c,n])=>`<option value="${c}" ${anaF.grade===c?'selected':''}>🎓 ${n}</option>`).join('')}</select>
    <select id="fd">${[[7,'최근 7일'],[30,'최근 30일'],[90,'최근 90일'],[0,'전체 기간']].map(([v,l])=>`<option value="${v}" ${anaF.days==v?'selected':''}>${l}</option>`).join('')}</select>
    <select id="fs"><option value="">전체 과목</option>${subs.map(s=>`<option ${anaF.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
  if(!atts.length){ $('#app').innerHTML = head + `<div class="card empty"><p>선택한 기간에 풀이 기록이 없습니다.</p>${other?'':`<button class="btn pri" onclick="go('setup')">문제 풀러 가기</button>`}</div>`; bindAnaFilters(); renderUserSummary(); return; }
  const n = atts.length, acc = atts.reduce((s,a)=>s+a.score,0)/n, avgT = atts.reduce((s,a)=>s+a.time,0)/n;
  const bySub = aggregate(atts, a=>a.subject).sort((a,b)=>a.acc-b.acc);
  const byUnit = aggregate(atts, a=> anaF.group==='sub' ? a.subject+'|'+a.unit+'|'+(a.subunit||'(미지정)') : a.subject+'|'+a.unit).sort((a,b)=>(a.n>=MIN_N?0:1)-(b.n>=MIN_N?0:1) || a.acc-b.acc);
  const byType = aggregate(atts, a=>a.type), byDiff = aggregate(atts, a=>a.difficulty);
  const byDay = aggregate(atts, a=>dayKey(a.ts)).sort((a,b)=>a.key<b.key?-1:1);
  const weak = weakUnits(atts, 3);
  $('#app').innerHTML = head + `
    <div class="kpis">
      <div class="kpi"><div class="l">풀이 문항</div><div class="v">${n}</div></div>
      <div class="kpi"><div class="l">정답률</div><div class="v">${pct(acc)}</div></div>
      <div class="kpi"><div class="l">평균 풀이시간</div><div class="v">${fmtSec(avgT)}</div></div>
      <div class="kpi"><div class="l">취약 단원 수</div><div class="v">${aggregate(atts,a=>a.subject+'|'+a.unit).filter(o=>o.n>=MIN_N&&o.acc<WEAK).length}</div></div>
    </div>
    <div class="card"><h3>💡 진단 및 학습 제안</h3><ul style="margin:0;padding-left:20px">${diagnose(atts, weak, avgT, !other).map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="charts">
      <div class="card"><h3>${anaF.subject?'단원별':'과목별'} 정답률</h3><div class="chartbox"><canvas id="c1"></canvas></div></div>
      <div class="card"><h3>일자별 정답률 추이</h3><div class="chartbox"><canvas id="c2"></canvas></div></div>
    </div>
    <div class="card"><div class="row"><h3 style="margin:0">단원별 상세</h3><span class="sp"></span>
      <label class="small"><input type="checkbox" id="grp" ${anaF.group==='sub'?'checked':''}> 소단원까지 보기</label></div>
      <div class="tbl" style="margin-top:8px"><table><tr><th>과목</th><th>단원</th>${anaF.group==='sub'?'<th>소단원</th>':''}<th class="num">풀이</th><th class="num">정답률</th><th class="num">평균시간</th><th>판정</th></tr>
      ${byUnit.map(o=>{ const p=o.key.split('|'); return `<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td>${anaF.group==='sub'?`<td>${esc(p[2])}</td>`:''}<td class="num">${o.n}</td><td class="num">${pct(o.acc)}</td><td class="num">${fmtSec(o.avgTime)}</td><td>${judge(o)}</td></tr>`; }).join('')}</table></div>
      <div class="hint">판정 기준: 정답률 ${WEAK*100}% 미만 취약 · ${GOOD*100}% 미만 보통 · 이상 양호 (${MIN_N}문항 미만은 표본부족)</div></div>
    <div class="charts">
      <div class="card"><h3>유형별</h3>${miniTable(byType, TYPES)}</div>
      <div class="card"><h3>난이도별</h3>${miniTable(byDiff, DIFFS)}</div>
    </div>
    ${!anaF.subject && bySub.length?`<div class="card"><h3>과목별 요약</h3>${miniTable(bySub)}</div>`:''}`;

function bindAnaFilters(){
  const fu = $('#fu'); if(fu) fu.onchange = e=>{ anaF.user = e.target.value; anaF.grade = anaF.user===AUTH.id ? AUTH.grade : ''; delete ANA_CACHE[anaF.user]; viewAnalysis(); };
  $('#fg').onchange = e=>{ anaF.grade = e.target.value; viewAnalysis(); };
  $('#fd').onchange = e=>{ anaF.days = +e.target.value; viewAnalysis(); };
  $('#fs').onchange = e=>{ anaF.subject = e.target.value; viewAnalysis(); };
}
function miniTable(rows, order){
  if(order) rows = order.map(k=>rows.find(r=>r.key===k)).filter(Boolean);
  return `<div class="tbl"><table><tr><th>구분</th><th class="num">풀이</th><th class="num">정답률</th><th class="num">평균시간</th><th>판정</th></tr>
    ${rows.map(o=>`<tr><td>${esc(o.key)}</td><td class="num">${o.n}</td><td class="num">${pct(o.acc)}</td><td class="num">${fmtSec(o.avgTime)}</td><td>${judge(o)}</td></tr>`).join('')}</table></div>`;
}
function diagnose(atts, weak, avgT, own=true){
  const out = [];
  if(!weak.length){
    const low = aggregate(atts, a=>a.subject+'|'+a.unit).filter(o=>o.n<MIN_N);
    out.push(`정답률 ${WEAK*100}% 미만인 취약 단원이 없습니다.` + (low.length?` 다만 ${low.length}개 단원은 풀이가 ${MIN_N}문항 미만이라 판정이 보류되었습니다. 더 풀어 보세요.`:''));
  }
  for(const w of weak){
    const ua = atts.filter(a=>a.subject+'|'+a.unit===w.key);
    const d = aggregate(ua, a=>a.difficulty).sort((a,b)=>a.acc-b.acc)[0];
    const s = aggregate(ua, a=>a.subunit||null).filter(o=>o.n>=2).sort((a,b)=>a.acc-b.acc)[0];
    let t = `<b>${esc(w.sample.subject)} › ${esc(w.sample.unit)}</b> 정답률 ${pct(w.acc)} (${w.n}문항).`;
    if(d && d.acc < w.acc+0.001 && d.n>=2) t += ` 특히 난이도 '${d.key}' 문항 정답률이 ${pct(d.acc)}입니다.`;
    if(s && s.acc < 0.5) t += ` 소단원 '${esc(s.key)}'(${pct(s.acc)})부터 개념을 다시 정리하세요.`;
    out.push(t);
  }
  const slow = aggregate(atts, a=>a.subject+'|'+a.unit).filter(o=>o.n>=3 && o.avgTime > avgT*1.5 && o.acc >= WEAK);
  for(const o of slow.slice(0,2)) out.push(`<b>${esc(o.sample.subject)} › ${esc(o.sample.unit)}</b>: 정답률은 ${pct(o.acc)}이지만 평균 ${fmtSec(o.avgTime)}로 전체 평균보다 오래 걸립니다. 시간 단축 연습이 필요합니다.`);
  const types = aggregate(atts, a=>a.type).filter(o=>o.n>=MIN_N).sort((a,b)=>a.acc-b.acc);
  if(types.length>1 && types[types.length-1].acc - types[0].acc >= 0.2) out.push(`유형별 편차: '${types[0].key}' 정답률(${pct(types[0].acc)})이 '${types[types.length-1].key}'(${pct(types[types.length-1].acc)})보다 크게 낮습니다.`);
  const wn = own ? openWrong().length : 0; if(wn) out.push(`해결하지 못한 오답이 ${wn}문항 있습니다. <a href="#" onclick="startWrongSession();return false">오답 다시 풀기</a>로 복습하세요.`);
  return out;
}
function drawCharts(groups, byDay){
  if(!window.Chart) return;
  const cs = getComputedStyle(document.documentElement), col = v=>cs.getPropertyValue(v).trim();
  Chart.defaults.color = col('--muted'); Chart.defaults.borderColor = col('--line'); Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const g = groups.slice().sort((a,b)=>a.acc-b.acc);
  charts.push(new Chart($('#c1'), {type:'bar', data:{labels:g.map(o=>o.key), datasets:[{data:g.map(o=>Math.round(o.acc*100)), backgroundColor:g.map(o=>o.n>=MIN_N && o.acc<WEAK ? col('--bad') : col('--primary')), borderRadius:4, maxBarThickness:28}]},
    options:{indexAxis:'y', maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`정답률 ${c.raw}% (${g[c.dataIndex].n}문항)`}}}, scales:{x:{min:0,max:100,ticks:{callback:v=>v+'%'}}, y:{grid:{display:false}}}}}));
  charts.push(new Chart($('#c2'), {type:'line', data:{labels:byDay.map(o=>o.key.slice(5)), datasets:[{data:byDay.map(o=>Math.round(o.acc*100)), borderColor:col('--primary'), backgroundColor:col('--primary'), tension:.25, pointRadius:3}]},
    options:{maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`정답률 ${c.raw}% (${byDay[c.dataIndex].n}문항)`}}}, scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}, x:{grid:{display:false}}}}}));
}

let wrongF = {subject:'', showCleared:false};

  const qmap = new Map(DB.questions.map(q=>[q.id,q]));
  const all = Object.entries(DB.wrong).filter(([id,w])=>!w.deleted && qmap.has(id));
  const subs = [...new Set(all.map(([id])=>qmap.get(id).subject))];
  const list = all.filter(([id,w])=>(wrongF.showCleared || !w.cleared) && (!wrongF.subject || qmap.get(id).subject===wrongF.subject))
                  .sort((a,b)=>b[1].count-a[1].count || b[1].lastTs-a[1].lastTs);
  const open = openWrong().length;
  $('#app').innerHTML = `<div class="row" style="margin-bottom:14px"><h2 style="margin:0">오답노트</h2><span class="sp"></span>
      <select id="ws"><option value="">전체 과목</option>${subs.map(s=>`<option ${wrongF.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <label class="small"><input type="checkbox" id="wc" ${wrongF.showCleared?'checked':''}> 극복한 문제도 보기</label>
      <button class="btn pri" onclick="startWrongSession()" ${open?'':'disabled'}>↻ 오답 다시 풀기 (${open})</button></div>
    <div class="card">${list.length ? list.map(([id,w])=>{ const q = qmap.get(id); return `<div class="list-q">
        <div class="row small"><span class="badge ${w.cleared?'b-ok':'b-bad'}">${w.cleared?'극복':'미해결'}</span>
          ${w.count?`<span class="badge ${w.count>=2?'b-bad':'b-mute'}">틀린 횟수 ${w.count}</span>`:''}${w.starred?'<span class="badge b-warn">★ 저장</span>':''}
          <span class="muted">${new Date(w.lastTs).toLocaleDateString('ko-KR')}</span><span class="sp"></span>
          <button class="btn sm danger" data-rm="${esc(id)}">삭제</button></div>
        ${wrongItemHTML(q, [...DB.attempts].reverse().find(a=>a.qid===id && a.score<1))}</div>`; }).join('')
      : '<p class="muted empty">오답노트가 비어 있습니다.</p>'}</div>`;
  $('#ws').onchange = e=>{ wrongF.subject = e.target.value; viewWrong(); };
  $('#wc').onchange = e=>{ wrongF.showCleared = e.target.checked; viewWrong(); };
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ DB.wrong[b.dataset.rm] = {deleted:true, mt:Date.now()}; saveDB(); scheduleRecordSync(); viewWrong(); });
  renderMath($('#app')); hydrateImages($('#app'));
}

/* =========================================================
   11-1. 풀이기록 (이벤트 로그) 조회
   - 풀이(정답·오답·부분)와 건너뛰기 이벤트를 시간순으로 조회 · 필터 · 상세 · CSV 내보내기
   - 관리자는 다른 사용자의 풀이기록도 조회 (DB 연결 시)
   ========================================================= */
let logF = {days:7, from:'', to:'', subject:'', result:'', type:'', q:'', user:null, limit:50, grade:''};
function logEvents(source, own){
  const ev = source.map(a=>({kind:'answer', grade:a.grade||'h3', ts:a.ts, qid:a.qid, subject:a.subject, unit:a.unit, type:a.type, difficulty:a.difficulty,
    answer:a.answer, score:a.score, time:a.time||0, sid:a.sid, appealed:a.appealed, points:a.points}));
  if(own) for(const [id,k] of Object.entries(DB.skips||{})){
    if(k.deleted) continue; const q = DB.questions.find(x=>x.id===id);
    ev.push({kind:'skip', grade:q?.grade||AUTH.grade, ts:k.ts||k.mt, qid:id, subject:q?.subject||'', unit:q?.unit||'', type:q?.type||'', difficulty:q?.difficulty||'', time:0});
  }
  return ev.sort((x,y)=>y.ts-x.ts);
}
const resultOf = e => e.kind==='skip' ? 'skip' : e.score>=1 ? 'ok' : e.score>0 ? 'part' : 'bad';
const RESULT_LABEL = {ok:['정답','b-ok'], part:['부분','b-warn'], bad:['오답','b-bad'], skip:['건너뜀','b-mute']};
function answerText(q, ans, isCorrect){
  if(ans==null || ans==='') return '<span class="muted">-</span>';
  if(q && q.type==='객관식'){ const i = +ans-1; return `${CIRCLED[i]||esc(ans)} ${q.choices && q.choices[i]?`<span class="muted small">${esc(String(q.choices[i]).slice(0,30))}</span>`:''}`; }
  const t = String(ans); return esc(isCorrect ? t.split('|')[0] : t.length>40 ? t.slice(0,40)+'…' : t);
}
function filteredLog(events){
  const now = Date.now(), from = logF.from ? new Date(logF.from+'T00:00:00').getTime() : (logF.days ? now - logF.days*86400000 : 0);
  const to = logF.to ? new Date(logF.to+'T23:59:59.999').getTime() : Infinity;
  const qmap = new Map(DB.questions.map(q=>[q.id,q])), kw = logF.q.trim().toLowerCase();
  return events.filter(e=>e.ts>=from && e.ts<=to && (!logF.grade || e.grade===logF.grade) && (!logF.subject || e.subject===logF.subject) && (!logF.type || e.type===logF.type)
    && (!logF.result || resultOf(e)===logF.result)
    && (!kw || String(e.qid).toLowerCase().includes(kw) || (qmap.get(e.qid)?.text||'').toLowerCase().includes(kw) || (e.unit||'').toLowerCase().includes(kw)));
}

  const opt = (v,l,cur) => `<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(l)}</option>`;
  $('#app').innerHTML = `<div class="row" style="margin-bottom:14px"><h2 style="margin:0">풀이기록${other?` <span class="badge b-warn">${esc(logF.user)}</span>`:''}</h2><span class="sp"></span>${userSel}
      <button class="btn sm" id="lcsv">⬇ CSV 내보내기</button></div>
    <div class="card"><div class="row">
      <select id="ld">${[[1,'오늘·최근 1일'],[7,'최근 7일'],[30,'최근 30일'],[90,'최근 90일'],[0,'전체 기간'],['custom','기간 지정']].map(([v,l])=>`<option value="${v}" ${(logF.from||logF.to?'custom':String(logF.days))===String(v)?'selected':''}>${l}</option>`).join('')}</select>
      <span id="lrange" ${logF.from||logF.to?'':'hidden'}><input type="date" id="lfrom" value="${esc(logF.from)}"> ~ <input type="date" id="lto" value="${esc(logF.to)}"></span>
      <select id="lg">${opt('','전체 학년',logF.grade)}${GRADES.filter(([c])=>events.some(e=>e.grade===c)||c===logF.grade).map(([c,n])=>opt(c,'🎓 '+n,logF.grade)).join('')}</select>
      <select id="ls">${opt('','전체 과목',logF.subject)}${subs.map(x=>opt(x,x,logF.subject)).join('')}</select>
      <select id="lr">${opt('','전체 결과',logF.result)}${Object.entries(RESULT_LABEL).filter(([k])=>!other||k!=='skip').map(([k,[l]])=>opt(k,l,logF.result)).join('')}</select>
      <select id="lt">${opt('','전체 유형',logF.type)}${TYPES.map(t=>opt(t,t,logF.type)).join('')}</select>
      <input type="text" id="lq" placeholder="문항ID·문제 내용·단원 검색" value="${esc(logF.q)}" style="flex:1;min-width:180px"></div></div>
    <div id="logbody"></div>`;
  const body = ()=>{ logF.limit = 50; renderLogBody(events); };
  $('#ld').onchange = e=>{ if(e.target.value==='custom'){ $('#lrange').hidden = false; if(!logF.from) logF.from = dayKey(Date.now()-6*86400000); if(!logF.to) logF.to = dayKey(Date.now()); $('#lfrom').value = logF.from; $('#lto').value = logF.to; }
    else { $('#lrange').hidden = true; logF.from = logF.to = ''; logF.days = +e.target.value; } body(); };
  $('#lfrom').onchange = e=>{ logF.from = e.target.value; body(); };
  $('#lto').onchange = e=>{ logF.to = e.target.value; body(); };
  $('#ls').onchange = e=>{ logF.subject = e.target.value; body(); };
  $('#lg').onchange = e=>{ logF.grade = e.target.value; body(); };
  $('#lr').onchange = e=>{ logF.result = e.target.value; body(); };
  $('#lt').onchange = e=>{ logF.type = e.target.value; body(); };
  $('#lq').oninput = e=>{ logF.q = e.target.value; clearTimeout(viewLog._t); viewLog._t = setTimeout(body, 250); };
  const lu = $('#lu'); if(lu) lu.onchange = e=>{ logF.user = e.target.value; logF.grade = logF.user===AUTH.id ? AUTH.grade : ''; delete ANA_CACHE[logF.user]; viewLog(); };
  $('#lcsv').onclick = ()=> exportLogCSV(filteredLog(events));
  renderLogBody(events);
}
function renderLogBody(events){
  const el = $('#logbody'); if(!el) return;
  const list = filteredLog(events), qmap = new Map(DB.questions.map(q=>[q.id,q]));
  const ans = list.filter(e=>e.kind==='answer'), sc = ans.reduce((x,e)=>x+e.score,0);
  const cnt = k => list.filter(e=>resultOf(e)===k).length;
  const kpi = `<div class="kpis">
      <div class="kpi"><div class="l">이벤트</div><div class="v">${list.length}</div></div>
      <div class="kpi"><div class="l">정답 · 부분 · 오답</div><div class="v" style="font-size:20px">${cnt('ok')} · ${cnt('part')} · ${cnt('bad')}</div></div>
      <div class="kpi"><div class="l">정답률</div><div class="v">${pct(ans.length ? sc/ans.length : null)}</div></div>
      <div class="kpi"><div class="l">건너뜀</div><div class="v">${cnt('skip')}</div></div>
      <div class="kpi"><div class="l">총 풀이시간</div><div class="v">${fmtSec(ans.reduce((x,e)=>x+e.time,0))}</div></div></div>`;
  if(!list.length){ el.innerHTML = kpi + '<div class="card empty"><p>조건에 맞는 풀이기록이 없습니다.</p></div>'; return; }
  const shown = list.slice(0, logF.limit);
  let lastDay = '', rows = '';
  const byDay = {}; for(const e of list){ const d = dayKey(e.ts); const o = byDay[d] ||= {n:0, a:0, s:0}; o.n++; if(e.kind==='answer'){ o.a++; o.s += e.score; } }
  shown.forEach((e,i)=>{
    const d = dayKey(e.ts);
    if(d!==lastDay){ lastDay = d; const o = byDay[d];
      rows += `<tr class="logday"><td colspan="8"><b>${d}</b> <span class="muted small">(${['일','월','화','수','목','금','토'][new Date(e.ts).getDay()]}) · ${o.n}건${o.a?` · 정답률 ${pct(o.s/o.a)}`:''}</span></td></tr>`; }
    const q = qmap.get(e.qid), r = resultOf(e), [rl, rc] = RESULT_LABEL[r];
    rows += `<tr class="logrow" data-i="${i}">
      <td class="num">${new Date(e.ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}</td>
      <td>${esc(e.subject)}<div class="muted small">${esc(e.unit)}</div></td>
      <td><span class="muted small">${esc(e.qid)}</span><div>${q ? esc(String(q.text).replace(/\s+/g,' ').slice(0,48))+(String(q.text).length>48?'…':'') : '<span class="muted">(삭제된 문항)</span>'}</div></td>
      <td><span class="small">${esc(e.type)}${e.difficulty?`<div class="muted">난이도 ${esc(e.difficulty)}</div>`:''}</span></td>
      <td>${e.kind==='skip' ? '<span class="muted">-</span>' : answerText(q || {type:e.type}, e.answer)}</td>
      <td>${q ? answerText(q, q.answer, true) : '<span class="muted">-</span>'}</td>
      <td><span class="badge ${rc}">${rl}</span>${e.appealed?' <span class="badge b-pri" title="오채점 이의로 정답 처리">인정</span>':''}</td>
      <td class="num">${e.kind==='skip'?'-':fmtSec(e.time)}</td></tr>
      <tr class="logdetail" id="ld${i}" hidden><td colspan="8"></td></tr>`;
  });
  el.innerHTML = kpi + `<div class="card"><div class="tbl"><table class="logtbl">
    <tr><th class="num">시각</th><th>과목·단원</th><th>문항</th><th>유형</th><th>제출 답</th><th>정답</th><th>결과</th><th class="num">소요</th></tr>${rows}</table></div>
    <div class="row" style="margin-top:10px"><span class="muted small">${shown.length} / ${list.length}건 표시 · 행을 누르면 문제·해설을 볼 수 있습니다</span><span class="sp"></span>
      ${list.length>shown.length?`<button class="btn sm" id="lmore">더 보기 (${Math.min(50, list.length-shown.length)}건)</button>`:''}</div></div>`;
  el.querySelectorAll('.logrow').forEach(tr=>tr.onclick=()=>{
    const i = +tr.dataset.i, d = $('#ld'+i), e = shown[i], q = qmap.get(e.qid);
    if(!d.hidden){ d.hidden = true; tr.classList.remove('open'); return; }
    d.hidden = false; tr.classList.add('open');
    d.firstElementChild.innerHTML = !q ? '<div class="muted small">문항이 문제은행에서 삭제되어 내용을 표시할 수 없습니다.</div>' :
      `<div class="logq"><div class="small muted">${esc(q.subject)} › ${esc(q.unit)}${q.subunit?' › '+esc(q.subunit):''} · ${esc(q.type)} · 난이도 ${esc(q.difficulty)} · ${q.points}점${e.sid?' · 세션 '+esc(e.sid):''}</div>
        <div style="margin:6px 0">${qTextHTML(q.text)}</div>${imgHTML(q)}
        ${q.type==='객관식'?`<div class="small">${q.choices.map((c,k)=>`<span style="margin-right:12px;${String(k+1)===String(q.answer)?'font-weight:700;color:var(--ok)':String(k+1)===String(e.answer)?'color:var(--bad)':''}">${CIRCLED[k]} ${rich(c)}</span>`).join('')}</div>`:''}
        ${q.type!=='객관식' && e.answer ? `<div class="small" style="margin-top:6px"><b>제출 답:</b> ${rich(e.answer)}</div>`:''}
        <div class="small"><b>정답:</b> ${q.type==='객관식' ? CIRCLED[+q.answer-1]+' '+rich(q.choices[+q.answer-1]||'') : q.type==='단답형' ? String(q.answer).split('|').map(esc).join(' / ') : rich(q.answer)}</div>
        ${q.explanation?`<div class="expl small">${rich(q.explanation)}</div>`:''}</div>`;
    renderMath(d); hydrateImages(d);
  });
  const more = $('#lmore'); if(more) more.onclick = ()=>{ logF.limit += 50; renderLogBody(events); };
}
function exportLogCSV(list){
  if(!list.length) return toast('내보낼 기록이 없습니다');
  const qmap = new Map(DB.questions.map(q=>[q.id,q]));
  const cell = v => { const t = v==null ? '' : String(v); return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const head = ['일시','사용자','학년','과목','단원','문항ID','문제','유형','난이도','제출 답','정답','결과','점수','소요(초)','정답 인정','세션'];
  const lines = list.map(e=>{ const q = qmap.get(e.qid), d = new Date(e.ts);
    return [`${dayKey(e.ts)} ${d.toLocaleTimeString('ko-KR',{hour12:false})}`, logF.user, gradeName(e.grade), e.subject, e.unit, e.qid, q ? String(q.text).replace(/\s+/g,' ').slice(0,200) : '(삭제된 문항)',
            e.type, e.difficulty, e.kind==='skip' ? '' : e.answer, q ? q.answer : '', RESULT_LABEL[resultOf(e)][0], e.kind==='skip' ? '' : e.score, e.kind==='skip' ? '' : e.time, e.appealed ? 'Y' : '', e.sid||''].map(cell).join(','); });
  const blob = new Blob(['﻿' + [head.join(','), ...lines].join('\r\n')], {type:'text/csv;charset=utf-8'});
  saveBlob(blob, `tamgu-log_${logF.user}_${dayKey(Date.now())}.csv`);   // 기기 호환을 위해 영문 파일명
}
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* =========================================================
   13. 문제은행 (Supabase DB: 학년 × 과목)
   - 사용자는 자기 학년의 과목별 문제은행을 받음 (바뀐 과목만 다시 받고 나머지는 기기 캐시 사용)
   - 관리자는 학년·과목별로 등록/교체/삭제
   ========================================================= */
const BANK_CACHE = 'tamgu_bank_v2';
const BANK = {sig:null, banks:[], loading:false, error:null};
function bankCacheGet(){ try{ return JSON.parse(localStorage.getItem(BANK_CACHE)||'{}'); }catch(e){ return {}; } }
function bankCacheSet(c){ try{ localStorage.setItem(BANK_CACHE, JSON.stringify(c)); }catch(e){ try{ localStorage.removeItem(BANK_CACHE); }catch(_){} } }
function dbToQ(r, b){
  return {id:r.question_id, subject:b.subject, grade:b.grade, bankId:b.id, unit:r.unit, subunit:r.subunit||'', type:r.q_type, difficulty:r.difficulty||'중',
          text:r.text, image:r.image||'', choices:Array.isArray(r.choices)?r.choices:[], answer:r.answer, explanation:r.explanation||'',
          points:Number(r.points)||(r.q_type==='객관식'?2:3), criteria:r.criteria||'', src:'shared'};
}
function qToDb(q, bankId){
  return {question_id:String(q.id), bank_id:bankId, unit:q.unit||'', subunit:q.subunit||null, q_type:TYPES.includes(q.type)?q.type:'객관식',
          difficulty:DIFFS.includes(q.difficulty)?q.difficulty:'중', text:q.text, image:q.image||null, choices:q.choices||[], answer:String(q.answer),
          explanation:q.explanation||null, points:Number(q.points)||null, criteria:q.criteria||null, updated_at:new Date().toISOString()};
}
const fetchBanks = grade => sbFetch(`/rest/v1/question_banks?select=id,grade,subject,question_count,updated_at&order=subject.asc${grade?`&grade=eq.${grade}`:''}`);
async function loadGradeQuestions(grade, {cache=true} = {}){
  const banks = await fetchBanks(grade);
  const C = cache ? bankCacheGet() : {}, g = C[grade] || (C[grade] = {q:{}}); g.q = g.q || {};
  const out = [];
  for(const b of banks){
    let e = g.q[b.id];
    if(!e || e.u !== b.updated_at){ e = g.q[b.id] = {u:b.updated_at, items:(await sbAll('questions', `select=*&bank_id=eq.${b.id}&order=question_id.asc`)).map(r=>dbToQ(r, b))}; }
    out.push(...e.items);
  }
  for(const id of Object.keys(g.q)) if(!banks.some(b=>String(b.id)===id)) delete g.q[id];
  if(cache){ g.banks = banks; for(const k of Object.keys(C)) if(k!==grade) delete C[k]; bankCacheSet(C); }   // 기기에는 내 학년만 보관
  return {banks, questions: out};
}
const bankSig = (grade, banks) => grade + '|' + banks.map(b=>b.id+':'+b.updated_at).join(',');
async function syncBank(force){
  if(!AUTH || !SB.session || !AUTH.grade || BANK.loading) return;
  BANK.loading = true; let changed = false; const grade = AUTH.grade;
  try{
    const {banks, questions} = await loadGradeQuestions(grade);
    if(!AUTH || AUTH.grade !== grade) return;
    const sig = bankSig(grade, banks);
    if(force || sig !== BANK.sig){
      const first = !BANK.sig; BANK.sig = sig; BANK.banks = banks;
      const ids = new Set(questions.map(q=>q.id));
      DB.questions = [...questions, ...DB.questions.filter(q=>q.src!=='shared' && !ids.has(q.id))];
      changed = true;
      if(!first && !force) toast(`🎓 ${gradeName(grade)} 문제은행이 업데이트되었습니다 (${questions.length}문항)`);
    }
    BANK.error = null;
  }catch(e){ console.warn(e); BANK.error = e.message; changed = true; }
  finally{ BANK.loading = false; if(changed && ['home','setup','me'].includes(current)) VIEWS[current](); }
}
/* 관리자: 학년·과목 문제은행에 문항 등록 */
async function publishToBank(grade, qs, mode){
  if(AUTH.role!=='admin') throw new Error('관리자만 등록할 수 있습니다');
  const subs = [...new Set(qs.map(q=>q.subject))];
  // 1) 문항ID 전체 고유성: 다른 학년 문제은행에 같은 ID가 있으면 중단
  const bankById = new Map((await fetchBanks()).map(b=>[b.id, b])), conflicts = [];
  for(let i=0; i<qs.length; i+=120){
    const list = qs.slice(i, i+120).map(q=>'"'+String(q.id).replace(/["\\]/g, m=>'\\'+m)+'"').join(',');
    const rows = await sbFetch(`/rest/v1/questions?select=question_id,bank_id&question_id=in.(${encodeURIComponent(list)})`);
    for(const r of rows){ const b = bankById.get(r.bank_id); if(b && b.grade !== grade) conflicts.push(`${r.question_id}: 이미 ${gradeName(b.grade)} · ${b.subject} 문제은행에 있습니다`); }
  }
  if(conflicts.length){ const e = new Error(`문항ID ${conflicts.length}건이 다른 학년 문제은행과 겹칩니다`); e.list = conflicts; throw e; }
  // 2) 과목 문제은행 준비 (없으면 생성)
  const banks = await sbFetch('/rest/v1/question_banks?on_conflict=grade,subject&select=id,grade,subject',
    {method:'POST', body:subs.map(sub=>({grade, subject:sub})), headers:{Prefer:'resolution=merge-duplicates,return=representation'}});
  const bid = new Map(banks.map(b=>[b.subject, b.id]));
  // 3) 과목 교체: 해당 과목의 기존 문항만 삭제
  if(mode==='replace') for(const sub of subs) await sbFetch(`/rest/v1/questions?bank_id=eq.${bid.get(sub)}`, {method:'DELETE', headers:{Prefer:'return=minimal'}});
  // 4) 문항 저장 (같은 ID는 덮어쓰기)
  await sbUpsert('questions', qs.map(q=>qToDb(q, bid.get(q.subject))), 'question_id');
  return {count: qs.length, subjects: subs};
}
async function sbUploadImage(f){
  await sbEnsure();
  const r = await fetch(`${SB_URL}/storage/v1/object/qimages/${encodeURIComponent(f.name)}`, {method:'POST', body:f,
    headers:{apikey:SB_KEY, Authorization:'Bearer '+SB.session.access_token, 'x-upsert':'true', 'Content-Type': f.type || mimeOf(f.name)}});
  if(!r.ok){ let m = 'HTTP '+r.status; try{ const j = await r.json(); m = j.message || j.error || m; }catch(e){} throw new Error(m); }
}

/* 이전 버전 문제은행(bank.enc) → 학년별·과목별 DB 문제은행으로 1회 이전 (관리자) */
const LEGACY = {checked:false, available:false, done:false, qs:null};
async function checkLegacy(){
  if(AUTH.role!=='admin' || LEGACY.checked) return; LEGACY.checked = true;
  try{
    const r = await fetch('bank.enc', {cache:'no-cache'}); if(!r.ok) return;
    if(!AUTH.key){ LEGACY.available = true; return; }
    LEGACY.qs = await decryptBank(await r.arrayBuffer());
    const sample = LEGACY.qs.slice(0, 60).map(q=>'"'+String(q.id).replace(/["\\]/g, m=>'\\'+m)+'"').join(',');
    const found = sample ? await sbFetch(`/rest/v1/questions?select=question_id&question_id=in.(${encodeURIComponent(sample)})`) : [];
    LEGACY.done = found.length >= Math.min(60, LEGACY.qs.length);
    LEGACY.available = !LEGACY.done && LEGACY.qs.length > 0;
  }catch(e){ console.warn(e); }
  if(LEGACY.available && ['home','upload'].includes(current)) VIEWS[current]();
}

/* =========================================================
   15. 로그인 (Supabase 인증 · 회원 권한/학년)
   - 아이디/비밀번호로 DB 인증 → 회원 정보(권한·학년·상태) 확인
   - 이전 버전 계정(users.json)·문제은행(bank.enc)은 최초 연결과 1회 이전에만 사용
   ========================================================= */
const te = new TextEncoder(), td = new TextDecoder();
const AUTH_KEY = 'tamgu_auth';
let AUTH = null;                                  // {id, role, raw:Uint8Array, key:CryptoKey}
function b64e(buf){ const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); }
const b64d = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
function mimeOf(k){ const e = String(k).split('.').pop().toLowerCase(); return ({png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml'})[e] || 'application/octet-stream'; }
async function deriveKEK(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function aesEnc(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); return {iv, ct: new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes))}; }
async function aesDec(key, iv, ct){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct)); }
async function decryptBank(buf){
  const j = JSON.parse(td.decode(buf));
  let plain; try{ plain = await aesDec(AUTH.key, b64d(j.iv), b64d(j.ct)); }catch(e){ throw new Error('문제은행 복호화 실패 (데이터 키 불일치)'); }
  return JSON.parse(td.decode(plain)).questions || [];
}
async function fetchUsers(){ try{ const r = await fetch('users.json', {cache:'no-cache'}); return r.ok ? r.json() : null; }catch(e){ return null; } }
/* 이전 버전 계정(users.json): 기존 문제은행 이전용 키 확인, DB 계정 최초 연결에만 사용 */
async function legacyUnwrap(id, pw){
  const U = await fetchUsers(), u = U && U.users && U.users[id]; if(!u) return null;
  try{ return await aesDec(await deriveKEK(pw, b64d(u.salt), U.iter), b64d(u.iv), b64d(u.wk)); }catch(e){ return null; }
}
async function setLegacyKey(raw){ AUTH.raw = raw; AUTH.key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt','decrypt']); }
function persistAuth(remember){

async function dbPull(uid){

  W.forEach(w=>{ R.wrong[w.question_id] = w.deleted ? {deleted:true, mt:ms(w.updated_at)}
                 : {count:w.wrong_count, lastTs:ms(w.last_wrong_at), cleared:w.cleared, starred:w.starred, mt:ms(w.updated_at)}; });

async function dbPush(M, R, uid){

  if(aRows.length) await sbUpsert('attempts', aRows, 'user_id,client_key');

  if(M.resetAt && (M.resetAt > (R.resetAt||0) || R.attempts.some(a=>a.ts < M.resetAt))){
    const t = encodeURIComponent(iso(M.resetAt));
    await sbFetch(`/rest/v1/attempts?user_id=eq.${uid}&answered_at=lt.${t}`, {method:'DELETE', headers:{Prefer:'return=minimal'}});

  }

    .map(q=>{ const d = {...q}; delete d.mt; delete d.src; return {user_id:uid, question_id:q.id, data:d, deleted:false, updated_at:iso(q.mt||Date.now())}; });
  Object.entries(M.qTomb||{}).forEach(([id,t])=>{ if(!live.has(id) && (R.qTomb[id]||0) < t) pRows.push({user_id:uid, question_id:id, data:null, deleted:true, updated_at:iso(t)}); });
  if(pRows.length) await sbUpsert('personal_questions', pRows, 'user_id,question_id');
  // 건너뛴 문제
  if(!SB.noSkipTable){
    const ksig = k => !k ? '' : k.deleted ? 'D'+(k.mt||0) : 'S'+(k.ts||0)+'|'+(k.mt||0);
    const kRows = Object.entries(M.skips||{}).filter(([id,k])=>ksig(k)!==ksig(R.skips[id])).map(([id,k])=>({user_id:uid, question_id:id,
      skipped_at: iso(k.ts||k.mt||Date.now()), deleted:!!k.deleted, updated_at: iso(k.mt||Date.now())}));
    if(kRows.length) try{ await sbUpsert('skipped_questions', kRows, 'user_id,question_id'); }catch(e){ if(isMissingTable(e)) SB.noSkipTable = true; else throw e; }

  const useL = (L.settingsMt||0) >= (R.settingsMt||0);
  return {v:1, attempts:[...am.values()].sort((x,y)=>x.ts-y.ts || (x.k<y.k?-1:1)), wrong:sortObj(wrong),
          questions:[...qm.values()].filter(q=>!((qTomb[q.id]||0) > (q.mt||0))).sort((x,y)=>x.id<y.id?-1:1),
          qTomb:sortObj(qTomb), skips:sortObj(skips), settings: useL ? L.settings : R.settings, settingsMt: Math.max(L.settingsMt||0, R.settingsMt||0), resetAt};
}
const recordJSON = r => JSON.stringify({attempts:r.attempts, wrong:sortObj(r.wrong), questions:[...(r.questions||[])].sort((x,y)=>x.id<y.id?-1:1), qTomb:sortObj(r.qTomb), skips:sortObj(r.skips), settings:r.settings, settingsMt:r.settingsMt||0, resetAt:r.resetAt||0});
async function syncRecords(){
  if(!AUTH || !SB.session) return;
  if(SYNC_STATE.busy){ SYNC_STATE.again = true; return; }
  SYNC_STATE.busy = true; setSyncStatus('busy');
  const me = AUTH.id, uid = SB.session.user_id;
  try{
    const R = await dbPull(uid);
    if(!AUTH || AUTH.id!==me) return;                                       // 동기화 중 로그아웃
    const before = recordJSON(localRecord());
    const shared = DB.questions.filter(q=>q.src==='shared'), sids = new Set(shared.map(q=>q.id));
    const merged = mergeRecords(localRecord(), R);
    merged.questions = merged.questions.filter(q=>!sids.has(q.id));          // 공용으로 게시된 문항은 개인 목록에서 제외
    DB.attempts = merged.attempts; DB.wrong = merged.wrong; DB.qTomb = merged.qTomb; DB.resetAt = merged.resetAt;
    DB.settings = merged.settings; DB.settingsMt = merged.settingsMt; DB.skips = merged.skips;
    DB.questions = [...shared, ...merged.questions];
    saveDB();
    const incoming = recordJSON(merged) !== before;
    await dbPush(merged, R, uid);
    SYNC_STATE.last = Date.now(); SYNC_STATE.error = null; setSyncStatus('idle');
    if(incoming && ['home','analysis','wrong','upload','setup','log'].includes(current)) VIEWS[current]();
  }catch(e){ console.warn(e); SYNC_STATE.error = e.message; setSyncStatus(SB.session ? 'error' : 'off'); }
  finally{ SYNC_STATE.busy = false; if(SYNC_STATE.again){ SYNC_STATE.again = false; setTimeout(syncRecords, 500); } }
}
async function loadMembers(){
  if(!SB.session || AUTH.role!=='admin') return null;
  try{ SB.members = await sbFetch('/rest/v1/members?select=login_id,role,grade,user_id,active&order=login_id.asc'); }catch(e){ SB.members = null; }
  return SB.members;
}
function removeLocalQ(pred){
  DB.qTomb = DB.qTomb || {}; const t = Date.now();
  DB.questions = DB.questions.filter(q=>{ if(q.src!=='shared' && pred(q)){ DB.qTomb[q.id] = t; return false; } return true; });
  saveDB(); scheduleRecordSync();
}

(async ()=>{ if(await restoreAuth()) enterApp(); else viewLogin(); })();
</script>
